<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b6cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="认知成长">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>认知成长 · 每日学习</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f3f5fa; --card:#ffffff; --ink:#151824; --ink2:#5d6480; --line:#e8ebf3;
  --pri:#5b6cff; --pri2:#8b5cf6; --ok:#12b76a; --warn:#f79009; --bad:#f04438;
  --en:#5b6cff; --ai:#8b5cf6; --fit:#12b76a; --fin:#f79009;
  --sh:0 6px 20px rgba(28,38,80,.07);
}
body.night{
  --bg:#0d0f16; --card:#171a24; --ink:#eceffa; --ink2:#8f97ad; --line:#262b38;
  --sh:0 6px 20px rgba(0,0,0,.35);
}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; transition:background .25s,color .25s;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column;
  background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.06)}
.bar{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  position:sticky;top:0;z-index:20;background:var(--bg)}
.bar .ttl{font-size:17px;font-weight:700;letter-spacing:.3px}
.bar .sub{font-size:11px;color:var(--ink2);margin-top:2px}
.icon-btn{width:34px;height:34px;border-radius:12px;background:var(--card);box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;font-size:16px;border:none;color:var(--ink);cursor:pointer}
main{flex:1;padding:0 16px 96px;overflow-x:hidden}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;
  border:1px solid transparent}
.card.tap{cursor:pointer;transition:transform .12s}
.card.tap:active{transform:scale(.985)}
h2.sec{font-size:13px;color:var(--ink2);font-weight:600;margin:18px 4px 10px;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.muted{color:var(--ink2)}
.tiny{font-size:11px}
.sm{font-size:12.5px}
.bold{font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600}
.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn{border:none;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn-main{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;width:100%}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-soft{background:rgba(91,108,255,.1);color:var(--pri)}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:11px}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog > i{display:block;height:100%;border-radius:99px;transition:width .3s}
.ring{width:74px;height:74px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0)}
.ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring span{position:relative;z-index:2;font-size:19px;font-weight:800;color:var(--ink)}
.ring small{position:absolute;z-index:2;bottom:15px;font-size:9px;color:var(--ink2)}
/* tabs */
nav{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:30;
  box-shadow:0 -6px 20px rgba(20,30,70,.06)}
nav button{flex:1;border:none;background:none;font-family:inherit;color:var(--ink2);font-size:9.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border-radius:12px}
nav button i{font-style:normal;font-size:19px;line-height:1;filter:grayscale(.35);transition:.2s}
nav button.on{color:var(--pri);font-weight:700}
nav button.on i{filter:none;transform:translateY(-1px)}
/* word card */
.wrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.wrow:last-child{border-bottom:none}
.wword{font-size:16.5px;font-weight:700;letter-spacing:.2px}
.wipa{font-size:11px;color:var(--ink2);margin-top:1px;font-family:"Segoe UI",Arial,sans-serif}
.wcn{font-size:12.5px;color:var(--ink2);margin-top:3px}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.snd{width:30px;height:30px;border-radius:50%;background:rgba(91,108,255,.1);color:var(--pri);
  display:flex;align-items:center;justify-content:center;font-size:14px;border:none;flex-shrink:0}
/* flash card */
.flash{background:linear-gradient(150deg,var(--pri),var(--pri2));border-radius:24px;color:#fff;
  padding:26px 20px;text-align:center;box-shadow:0 14px 34px rgba(91,108,255,.32);margin-bottom:16px}
.flash .w{font-size:38px;font-weight:800;letter-spacing:.5px;line-height:1.15;word-break:break-word}
.flash .ipa{opacity:.85;font-size:13px;margin-top:6px}
.flash .cn{font-size:18px;margin-top:14px;font-weight:600;letter-spacing:1px}
.flash .ex{font-size:12.5px;opacity:.8;margin-top:10px;line-height:1.6}
.mic{width:76px;height:76px;border-radius:50%;border:none;background:var(--card);color:var(--pri);
  font-size:30px;box-shadow:0 8px 24px rgba(20,30,70,.16);cursor:pointer;margin:6px auto 0;display:flex;
  align-items:center;justify-content:center;transition:.2s;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.mic.rec{background:var(--bad);color:#fff;transform:scale(1.06);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,68,56,.5)}100%{box-shadow:0 0 0 18px rgba(240,68,56,0)}}
.hint{text-align:center;font-size:12.5px;color:var(--ink2);margin-top:10px;min-height:20px}
.res-ok{color:var(--ok);font-weight:700}
.res-bad{color:var(--bad);font-weight:700}
/* quiz / input */
input[type=text]{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);font-family:inherit;font-size:16px;color:var(--ink);outline:none}
input[type=password]{width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);font-family:inherit;font-size:13px;color:var(--ink);outline:none}
input[type=text]:focus,input[type=password]:focus{border-color:var(--pri)}
select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);font-family:inherit;font-size:13px;color:var(--ink);outline:none;appearance:none}
select:focus{border-color:var(--pri)}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);font-family:inherit;font-size:13.5px;color:var(--ink);margin-bottom:9px;cursor:pointer;line-height:1.5}
.opt.ok{border-color:var(--ok);background:rgba(18,183,106,.09)}
.opt.no{border-color:var(--bad);background:rgba(240,68,56,.08)}
/* heat */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.heat div{aspect-ratio:1;border-radius:5px;background:var(--line)}
.heat div.v1{background:rgba(91,108,255,.35)}
.heat div.v2{background:rgba(91,108,255,.62)}
.heat div.v3{background:var(--pri)}
/* misc */
.mods{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.mods::-webkit-scrollbar{display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:rgba(20,24,36,.92);
  color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.28s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.lv{font-size:10.5px;padding:3px 8px;border-radius:8px;background:rgba(139,92,246,.14);color:var(--pri2);font-weight:700}
.li{display:flex;gap:9px;font-size:13.5px;line-height:1.75;margin:9px 0;color:var(--ink)}
.li b{color:var(--pri);flex-shrink:0}
.acc{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;cursor:pointer;background:var(--card)}
.acc .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.acc .body{display:none;margin-top:10px;font-size:13px;line-height:1.8;color:var(--ink2)}
.acc.open .body{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:11px;color:var(--ink2)}
.hero{background:linear-gradient(135deg,#4a5cf5,#8b5cf6 60%,#a855f7);border-radius:22px;padding:18px;
  color:#fff;box-shadow:0 14px 34px rgba(91,108,255,.3);margin-bottom:14px}
.hero .t{font-size:12px;opacity:.82;letter-spacing:1px}
.hero .n{font-size:22px;font-weight:800;margin-top:6px;line-height:1.3}
.chip{display:inline-flex;padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:600;
  background:var(--card);color:var(--ink2);border:1.5px solid var(--line);margin:0 8px 8px 0;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <header class="bar" id="topbar"></header>
  <main id="view"></main>
  <nav id="tabs"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 数据区（可分模块编辑） ============ */
const DAILY_WORDS = [];   /* 每日 20 个日常单词，10 组 */
const AI_WORDS    = [];   /* 每日 10 个 AI 单词，10 组 */
const AI_LESSONS  = [];   /* AI 课程池 */
const FIT_LESSONS = [];   /* 健身课程池 */
const FIN_LESSONS = [];   /* 金融课程池 */

/* ============ 基础工具 ============ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (html)=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;};
const pad = n=>String(n).padStart(2,'0');
const iso = d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const KEY = 'cog_growth_v1';
const BUILD = 'v2.0 · 11/26';
const today = ()=>iso(new Date());
function dateAdd(str,n){const d=new Date(str+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);}
function diffDays(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
function toast(t){const n=$('#toast');n.textContent=t;n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),1600);}

let S = load();
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!s||!s.start){
    // localStorage 被清时，尝试从 cookie 冗余备份恢复
    try{
      const m=document.cookie.match(/(?:^|; )cogbak=([^;]*)/);
      if(m){const o=JSON.parse(decodeURIComponent(m[1]));if(o&&o.start)s=o;}
    }catch(e){}
  }
  if(!s||!s.start){s={start:today(),nick:'学习者',daily:{},seen:{},wrong:{},night:false,goals:{en:true,ai:true,fit:true,fin:true}};}
  s.daily=s.daily||{};s.seen=s.seen||{};s.wrong=s.wrong||{};s.sent=s.sent||{};
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){updateCookieBackup(S);scheduleBackup();}}

/* ============ 备份：GitHub Gist 云同步 ============ */
const GH_KEY='cog_growth_gh';
const GH_DESC='认知成长 · 学习进度备份';
function GH(){try{return JSON.parse(localStorage.getItem(GH_KEY)||'{}');}catch(e){return {};}}
function GHSave(o){try{localStorage.setItem(GH_KEY,JSON.stringify(o));}catch(e){}}
async function ghApi(path,opt){
  const g=GH();
  const r=await fetch('https://api.github.com'+path,Object.assign({
    headers:{'Authorization':'Bearer '+(g.token||''),'Accept':'application/vnd.github+json','Content-Type':'application/json'}
  },opt||{}));
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('HTTP '+r.status+(t?(' · '+t.slice(0,80)):''));}
  return r.json();
}
async function findBackupGist(){
  const list=await ghApi('/gists?per_page=100');
  const hit=(list||[]).find(x=>x&&x.description===GH_DESC);
  return hit?hit.id:null;
}
let bkTimer=null,bkBusy=false;
function scheduleBackup(){
  const g=GH();
  if(!g.auto||!g.token||bkBusy)return;
  clearTimeout(bkTimer);bkTimer=setTimeout(()=>backupNow(true),8000);
}
async function backupNow(silent){
  const g=GH();
  if(!g.token){if(!silent)toast('请先在下面填入 GitHub token');return false;}
  bkBusy=true;
  const body={description:GH_DESC,public:false,
    files:{'cog-growth.json':{content:JSON.stringify({v:BUILD,at:Date.now(),data:S})}}};
  try{
    let id=g.gistId||await findBackupGist();
    if(id){await ghApi('/gists/'+id,{method:'PATCH',body:JSON.stringify(body)});}
    else{const r=await ghApi('/gists',{method:'POST',body:JSON.stringify(body)});id=r.id;}
    GHSave(Object.assign(GH(),{gistId:id,last:Date.now()}));
    if(!silent)toast('已备份到云端');
    bkBusy=false;
    return true;
  }catch(e){bkBusy=false;if(!silent)toast('备份失败：'+e.message);return false;}
}
async function restoreNow(){
  const g=GH();
  if(!g.token){toast('请先填入 GitHub token');return;}
  try{
    let id=g.gistId||await findBackupGist();
    if(!id){toast('账号里没找到备份，先做一次「立即备份」');return;}
    const r=await ghApi('/gists/'+id);
    const f=r.files&&(r.files['cog-growth.json']||Object.values(r.files||{})[0]);
    if(!f||f.truncated){toast('备份内容不完整');return;}
    const obj=JSON.parse(f.content||(await (await fetch(f.raw_url)).text()));
    const data=obj.data||obj;
    if(!data||!data.start){toast('备份格式不对');return;}
    if(!confirm('用云端备份覆盖本机进度？当前进度会被替换'))return;
    S=data;save();body_night();GHSave(Object.assign(GH(),{gistId:id,last:Date.now()}));
    toast('已恢复云端进度');render();
  }catch(e){toast('恢复失败：'+e.message);}
}

/* cookie 冗余：防只清 localStorage 的清理工具 */
function updateCookieBackup(s){
  try{
    const mini=JSON.stringify({start:s.start,nick:s.nick,daily:s.daily,seen:s.seen,wrong:s.wrong,sent:s.sent,night:s.night,at:Date.now()});
    if(mini.length>3800)return;
    document.cookie='cogbak='+encodeURIComponent(mini)+';max-age=31536000;path=/;SameSite=Lax';
  }catch(e){}
}
function restoreFromCookie(){
  try{
    const m=document.cookie.match(/(?:^|; )cogbak=([^;]*)/);
    if(!m)return false;
    const obj=JSON.parse(decodeURIComponent(m[1]));
    if(!obj.start)return false;
    S=Object.assign({},S,obj);save();return true;
  }catch(e){return false;}
}
function D(){
  const k=today();
  const r=S.daily[k]||(S.daily[k]={w:{},s:{},enDone:false,aiDone:false,aiOk:0,fitDone:false,fitOk:0,finDone:false,finOk:0});
  r.w=r.w||{};r.s=r.s||{};
  return r;
}
/* 今日英语完成判定：词 + 句掌握数达到 30 即视为完成 */
function checkEnDone(){
  const d=D();
  const n=Object.keys(d.w||{}).length+Object.keys(d.s||{}).length;
  if(n>=30&&!d.enDone){d.enDone=true;save();toast('英语模块今日完成 ✓');}
}
function dayNo(){return diffDays(S.start,today())+1;}
function streak(){
  let n=0,d=today();
  while(true){
    const r=S.daily[d];
    const done=r&&(r.enDone||r.aiDone||r.fitDone||r.finDone||Object.keys(r.w||{}).length>=8||Object.keys(r.s||{}).length>=5);
    if(!done){if(d===today()){d=dateAdd(d,-1);continue;}break;}
    n++;d=dateAdd(d,-1);
  }
  return n;
}

/* ============ 音频 / 语音 ============ */
let voice=null, VOICES=[];
/* 声音打分：自然语音 > 常见内置语音，机械音排后面 */
function scoreVoice(v){
  const n=(v.name||'').toLowerCase();
  let s=0;
  if(/natural|neural|online/.test(n))s+=40;
  if(/aria|emma|ava|jenny|guy|andrew|brian|samantha|karen|daniel|moira|tessa/.test(n))s+=25;
  if(/google us english|google uk english/.test(n))s+=22;
  if(/siri/.test(n))s+=18;
  if(/zira|david|mark/.test(n))s+=6;
  if(/compact|espeak|robot/.test(n))s-=20;
  if(/^en-us/i.test(v.lang))s+=6; else if(/^en-gb/i.test(v.lang))s+=4;
  if(v.localService===false)s+=8;   // 云端语音通常更自然
  return s;
}
function pickVoice(){
  VOICES=(speechSynthesis.getVoices()||[]).filter(v=>/^en([-_]|$)/i.test(v.lang));
  VOICES.sort((a,b)=>scoreVoice(b)-scoreVoice(a));
  const saved=S.voiceName?VOICES.find(v=>v.name===S.voiceName):null;
  voice=saved||VOICES[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
/* ---- 朗读：真人录音优先（联网），不可用则回退系统 TTS ---- */
let curAudio=null;
function stopSpeak(){
  try{if(curAudio){curAudio.pause();curAudio.src='';curAudio=null;}}catch(e){}
  try{speechSynthesis.cancel();}catch(e){}
}
function speakSystem(text,rate){
  if(!('speechSynthesis' in window)){toast('当前浏览器不支持发音');return;}
  try{speechSynthesis.cancel();}catch(e){}
  const r=rate||S.rate||0.9;
  let parts=String(text).split(/(?<=[.!?;:])\s+/).filter(Boolean);
  if(parts.length<2)parts=[text];
  parts.forEach(p=>{
    const u=new SpeechSynthesisUtterance(p);
    u.lang=/^en-gb/i.test((voice&&voice.lang)||'')?'en-GB':'en-US';
    u.rate=r;u.pitch=1;u.volume=1;
    if(voice)u.voice=voice;
    speechSynthesis.speak(u);
  });
}
function speak(text,rate){
  const src=String(text||'').trim();
  if(!src)return;
  stopSpeak();
  const r=rate||S.rate||0.9;
  const online=('voiceMode' in S?S.voiceMode:'auto')!=='sys' && navigator.onLine!==false
    && src.length<=120 && r>=0.8;   // 长句和慢速跟读交给系统语音更稳
  if(!online){speakSystem(src,rate);return;}
  let started=false,dead=false,t=null;
  const a=new Audio('https://dict.youdao.com/dictvoice?type=2&audio='+encodeURIComponent(src));
  a.preload='auto';
  a.playbackRate=Math.min(1.25,Math.max(0.75,r/0.95));
  curAudio=a;
  const fallback=()=>{
    if(started||dead)return;    // 已经在播就不再叠一层系统语音
    dead=true;clearTimeout(t);
    try{a.pause();a.removeAttribute('src');a.load();}catch(e){}
    if(curAudio===a)curAudio=null;
    speakSystem(src,rate);
  };
  a.onplaying=()=>{started=true;clearTimeout(t);};
  a.onerror=fallback;
  // 只有确实拿不到音频数据时才回退，避免"机器音 + 真人音"先后响两遍
  t=setTimeout(()=>{if(!started&&a.readyState===0&&a.networkState===3)fallback();},6000);
  const p=a.play();
  if(p&&p.catch)p.catch(()=>{if(!started)fallback();});
}

function sim(a,b){
  a=(a||'').toLowerCase().replace(/[^a-z' ]/g,'').trim();
  b=(b||'').toLowerCase().replace(/[^a-z' ]/g,'').trim();
  if(!a)return 0;
  if(a===b)return 1;
  const m=a.length,n=b.length,dp=[];
  for(let i=0;i<=m;i++){dp[i]=[i];}
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return 1-dp[m][n]/Math.max(m,n);
}

/* 环形取片，不足时自动从头续 */
function wheel(arr,n,start){
  const out=[];const L=arr.length;
  for(let i=0;i<n&&L;i++)out.push(arr[((start+i)%L+L)%L]);
  return out;
}
function todayWords(){

  return {
    daily: wheel(DAILY_WORDS,20,b*20+ex.en*20),

    sent:  wheel(DAILY_SENTENCES,10,b*10+ex.en*10)
  };
}
function todaySent(){return todayWords().sent;}
function lesson(pool){
  const n=dayNo()-1;
  return pool[n%pool.length];
}

/* 句子填空 */
function blankify(s){
  const kw=s[2];
  try{
    const esc=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const r=new RegExp('\\b'+esc+'\\b','i');
    if(r.test(s[0]))return s[0].replace(r,'______');
  }catch(e){}
  return s[0].replace(new RegExp(kw,'i'),'______');
}

    $('#prevW').onclick=()=>{flashIdx=Math.max(0,flashIdx-1);render();};
    $('#nextW').onclick=()=>{flashIdx=Math.min(list.length-1,flashIdx+1);render();};
    const mic=$('#micBtn'), hint=$('#hint');
    const pass=isS?0.7:0.85, near=isS?0.45:0.55;
    let recActive=false,gotResult=false,micReady=false;
    async function ensureMic(){
      if(micReady)return true;
      try{
        if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
          const st=await navigator.mediaDevices.getUserMedia({audio:true});
          st.getTracks().forEach(t=>t.stop());
        }
        micReady=true;return true;
      }catch(e){
        const n=(e&&e.name)||'Error';
        const m={'NotAllowedError':'浏览器把本站麦克风设成禁止，点地址栏图标改成「允许」再刷新',
          'NotFoundError':'没检测到麦克风设备，接个耳机试试',
          'NotReadableError':'麦克风被别的应用占用，先关掉录音/通话',
          'SecurityError':'当前页面不是 https，麦克风用不了'};
        hint.innerHTML='<span class="res-bad">麦克风没开成</span> '+(m[n]||('（'+n+'）'));
        return false;
      }
    }
    async function startRec(){
      if(!SR){hint.innerHTML='<span class="res-bad">此浏览器不支持语音识别</span>，请用'+(isS?'句子填空':'默写练习');return;}
      if(recActive)return;
      if(!micReady&&!(await ensureMic()))return;
      recActive=true;gotResult=false;
      if(rec){try{rec.abort();}catch(e){}}
      rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=3;
      try{rec.continuous=true;}catch(e){}
      mic.classList.add('rec');hint.textContent='正在听…读完松手';
      rec.onresult=(ev)=>{
        gotResult=true;
        let best='',bs=0;
        for(let i=0;i<ev.results.length;i++)for(let j=0;j<ev.results[i].length;j++){
          const s=sim(list[flashIdx][0],ev.results[i][j].transcript);if(s>bs){bs=s;best=ev.results[i][j].transcript;}
        }
        if(bs>=pass){
          hint.innerHTML=`<span class="res-ok">${isS?'这句过了！':'很标准！'}</span> ${Math.round(bs*100)} 分`;
          const d=D(),w=list[flashIdx][0];
          if(isS){d.s[w]=1;S.sent[w]=1;}else{d.w[w]=1;S.seen[w]=1;}
          save();checkEnDone();
        }else if(bs>=near){
          hint.innerHTML=`<span style="color:var(--warn);font-weight:700">接近了</span> 听到 “${best}” · ${Math.round(bs*100)} 分，再读一遍`;
        }else{
          hint.innerHTML=`<span class="res-bad">再试一次</span> 听到 “${best||''}”，可以点慢速发音跟一遍`;
        }
      };
      rec.onerror=(e)=>{
        mic.classList.remove('rec');recActive=false;
        if(gotResult)return;
        const m={'not-allowed':'麦克风被拒绝，点地址栏的图标改成允许再试',
          'service-not-allowed':'浏览器没有语音识别服务，换个浏览器试试',
          'no-speech':'没听到声音：按住 🎤 后立刻开口读，别先松手',
          'audio-capture':'找不到麦克风，检查设备后重试',
          'network':'语音识别需要联网，检查网络后重试'};
        hint.innerHTML='<span class="res-bad">没能识别</span> '+(m[e.error]||('（'+e.error+'）'));
      };
      rec.onend=()=>{
        mic.classList.remove('rec');recActive=false;
        if(!gotResult&&!hint.innerHTML.includes('res-bad'))hint.textContent='没听到声音，按住 🎤 后立刻开口读';
      };
      try{rec.start();}catch(e){mic.classList.remove('rec');recActive=false;hint.textContent='无法启动识别，请检查麦克风权限';}
    }
    function stopRec(){if(rec&&recActive){try{rec.stop();}catch(e){}}}
    if(SR){
      mic.onpointerdown=(e)=>{e.preventDefault();startRec();};
      ['pointerup','pointercancel','pointerleave'].forEach(t=>mic.addEventListener(t,stopRec));
      mic.onclick=(e)=>e.preventDefault();
    }else{
      mic.onclick=()=>startRec();
    }
  }

  // 默写（单词）
  if(enMode==='write'&&route==='english'){
    const list=(enGroup==='daily'?todayWords().daily:todayWords().ai);
    const w=list[writingIdx], ans=$('#ans'), hint=$('#hint');
    $('#backList').onclick=()=>{enMode='list';render();};
    $('#hearIt').onclick=()=>speak(w[0]);
    const check=()=>{
      const v=ans.value.trim().toLowerCase();
      if(!v){hint.innerHTML='<span class="muted">先写一个答案吧</span>';return;}
      if(v===w[0].toLowerCase()){
        hint.innerHTML='<span class="res-ok">正确！</span> '+w[0]+' · '+w[2];
        const d=D(),k=w[0];d.w[k]=1;S.seen[k]=1;delete S.wrong[v];save();checkEnDone();
        setTimeout(()=>{if(writingIdx<list.length-1){writingIdx++;render();}},900);
      }else{
        hint.innerHTML='<span class="res-bad">拼写不对</span> 正确写法是 <b>'+w[0]+'</b>';
        S.wrong[v]=w[0];save();
      }
    };
    $('#checkW').onclick=check;
    ans.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
    $('#skipW').onclick=()=>{if(writingIdx<list.length-1){writingIdx++;render();}else{toast('已经是最后一个了');}};
    setTimeout(()=>ans.focus(),300);
  }

  // 句子填空
  if(enMode==='blank'&&route==='english'){
    const list=todayWords().sent;
    const w=list[writingIdx], kw=w[2], ans=$('#ans'), hint=$('#hint');
    $('#backList').onclick=()=>{enMode='list';render();};
    $('#hearIt').onclick=()=>speak(w[0],0.9);
    const check=()=>{
      const v=ans.value.trim().toLowerCase().replace(/[^a-z']/g,'');
      if(!v){hint.innerHTML='<span class="muted">先填空吧</span>';return;}
      if(v===kw.toLowerCase()){
        hint.innerHTML='<span class="res-ok">填对了！</span> '+w[0];
        const d=D();d.s[w[0]]=1;S.sent[w[0]]=1;save();checkEnDone();
        setTimeout(()=>{if(writingIdx<list.length-1){writingIdx++;render();}},1000);
      }else{
        hint.innerHTML='<span class="res-bad">不对</span> 正确答案是 <b>'+kw+'</b>';
      }
    };
    $('#checkW').onclick=check;
    ans.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
    $('#skipW').onclick=()=>{if(writingIdx<list.length-1){writingIdx++;render();}else{toast('已经是最后一句了');}};
    setTimeout(()=>ans.focus(),300);
  }

  // 概念小节：一键标记完成（无随堂题的课）
  const md=$('#markDone');
  if(md&&['ai','fitness','finance'].includes(route)){
    const k=route==='ai'?'ai':route==='fitness'?'fit':'fin';
    md.onclick=()=>{
      const d=D();
      if(k==='ai'){d.aiDone=true;d.aiOk=(d.aiOk||0)+1;}
      else if(k==='fit'){d.fitDone=true;d.fitOk=(d.fitOk||0)+1;}
      else{d.finDone=true;d.finOk=(d.finOk||0)+1;}
      save();
      const h=$('#hint');if(h)h.innerHTML='<span class="res-ok">已记录</span> 本节完成，计入今日进度';
      toast('本节已完成，计入打卡');
    };
  }

  // 课程自测
  const opts=$('#opts');
  if(opts&&['ai','fitness','finance'].includes(route)){
    const k=route==='ai'?'ai':route==='fitness'?'fit':'fin';
    const L=lessonFor(k);
    opts.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(opts.dataset.done==='1')return;
      const i=+b.dataset.o;
      opts.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','no'));
      if(i===L.q.a){
        opts.dataset.done='1';
        b.classList.add('ok');
        $('#hint').innerHTML='<span class="res-ok">答对了 ✓</span> 「'+L.sum+'」';
        const d=D();
        if(k==='ai'){d.aiDone=true;d.aiOk=(d.aiOk||0)+1;}
        else if(k==='fit'){d.fitDone=true;d.fitOk=(d.fitOk||0)+1;}
        else{d.finDone=true;d.finOk=(d.finOk||0)+1;}
        save();toast('本节已完成，计入打卡');
      }else{
        b.classList.add('no');
        opts.querySelectorAll('.opt')[L.q.a].classList.add('ok');
        $('#hint').innerHTML='<span class="res-bad">再想想</span> 正确答案是 '+String.fromCharCode(65+L.q.a)+'，点一下正确选项即可完成';
      }
    });
  }

  // 我的
  if(route==='me'){
    const gt=$('#ghToken');
    if(gt)gt.onchange=()=>{const v=gt.value.trim();if(!v)return;
      if(!/^(ghp_|github_pat_)/.test(v)){toast('这不像 GitHub token');return;}
      GHSave(Object.assign(GH(),{token:v}));gt.value='';render();toast('token 已保存到本机');};
    const gb=$('#ghBackup');if(gb)gb.onclick=()=>backupNow(false);
    const gr=$('#ghRestore');if(gr)gr.onclick=()=>restoreNow();
    const ga=$('#ghAuto');if(ga)ga.onclick=()=>{const gg=GH();GHSave(Object.assign(gg,{auto:!gg.auto}));render();toast(gg.auto?'已开启自动同步':'已关闭自动同步');};
    const vms=$('#voiceModeSel');
    if(vms)vms.onchange=()=>{S.voiceMode=vms.value;save();render();
      setTimeout(()=>{speak('Hello. Nice to meet you.');toast(vms.value==='sys'?'已切换系统语音':'已切换真人发音');},150);};

    const nr=$('#nightRow');if(nr)nr.onclick=()=>{S.night=!S.night;save();body_night();render();};
    const nk=$('#nickRow');if(nk)nk.onclick=()=>{const v=prompt('输入你的昵称',S.nick);if(v&&v.trim()){S.nick=v.trim().slice(0,10);save();render();}};
    const rr=$('#resetRow');if(rr)rr.onclick=()=>{if(confirm('确认清空所有学习数据？此操作不可恢复')){localStorage.removeItem(KEY);S=load();body_night();render();toast('已重置');}};
  }
  topBar();
}
</script>

{t:"AI 到底是什么：先分清「会背」和「会想」",lv:"初级",min:6,
 pts:["人工智能不是让机器有意识，而是让机器用数据做判断。今天看到的所有 AI，本质都是「从大量例子中找规律」。",
      "弱 AI：只会做一件事，比如识别图片、翻译、推荐视频。强 AI：能像人一样处理任何任务，目前还不存在。",

      "分布问题：现实世界和训练数据不一样，模型在「没见过的场景」里容易失效。",
      "目标问题：模型只优化你给它的指标。指标设计错了，它会努力做错的事。",
      "所以 AI 的输出要当成「初稿」，不要当成「结论」。人在回路（human in the loop）永远是最后一道保险。"],
 sum:"错不在「机器笨」，多半在数据、场景或目标定义。",
 q:{q:"模型在实验室表现很好，上线后却频繁出错，最可能的原因是？",o:["模型参数太少","线上数据和训练数据分布不同","用户打字太慢"],a:1}},

/* —— 中级 6-10 —— */
{t:"神经网络怎么学习：前向、损失、反向传播",lv:"中级",min:9,
 pts:["前向传播：数据从输入层一路算到输出层，得到一个预测值。",
      "计算损失：把预测值和正确答案比较，差得越多损失越大。",
      "反向传播：把误差从输出层往回传，算出每个参数「该负多少责任」。",
      "梯度下降：沿着让损失变小的方向，微调所有参数，重复几百万次。"],
 sum:"预测 → 算误差 → 反向追责 → 小步调参，循环到误差足够小。",
 q:{q:"「反向传播」主要解决什么问题？",o:["把误差分配到各个参数，指导调参","把数据从输入传到输出","压缩模型体积"],a:0}},

{t:"过拟合：背答案的学生",lv:"中级",min:8,
 pts:["过拟合 = 训练集考 100 分，新题只考 60 分。模型把噪声也背了下来，没有学到通用规律。",
      "三个信号：训练准确率远高于验证准确率；参数过多；数据太少。",
      "三个解法：更多数据、正则化（限制参数变大）、早停（在验证集变差前停下）、Dropout（训练时随机丢神经元）。",
      "判断标准只有一个：在「没见过的数据」上表现如何，而不是在训练集上。"],
 sum:"训练集高分不算本事，验证集高分才算学会。",
 q:{q:"下列哪种做法最能缓解过拟合？",o:["增加训练轮次","增加更多高质量数据","把所有参数调大"],a:1}},

{t:"大语言模型如何「说话」：本质是猜下一个词",lv:"中级",min:9,
 pts:["大模型不是先想好整段话再输出，而是每次预测「下一个最可能的词」，逐个往外吐。",
      "每个位置它都给所有候选词一个概率，按概率采样。温度高 → 更随机更有创意；温度低 → 更稳定更保守。",
      "它没有真正的「理解」，但通过海量文本学到了语言中的统计规律，所以看起来很像懂。",
      "这解释了胡说八道的机制：它优化的是「像不像人话」，不是「对不对」。"],
 sum:"逐词预测概率 → 采样输出；流畅不等于正确。",
 q:{q:"把温度（temperature）调低，通常会带来什么变化？",o:["输出更随机更有创意","输出更稳定更保守","模型参数变少"],a:1}},

{t:"提示词工程：把 AI 当聪明但没背景的实习生",lv:"中级",min:8,
 pts:["原则一：给角色和场景。「你是有十年经验的健身教练，帮我改训练计划」。",
      "原则二：给任务和格式。说清楚要什么、多长、用什么结构，比说「写好一点」有效十倍。",
      "原则三：给例子。一个输入输出示例，胜过一大段抽象描述（few-shot）。",
      "原则四：分步骤、允许说不知道。复杂任务拆成几步；明确「信息不足就提问」，能明显减少编造。"],
 sum:"角色 + 任务 + 格式 + 例子 + 分步，是提示词的五个抓手。",
 q:{q:"想让 AI 按固定格式输出周报，最有效的做法是？",o:["多说几遍「认真写」","给出一个周报示例并规定结构","把问题问得更短"],a:1}},

{t:"向量与语义检索：AI 的「找资料」能力",lv:"中级",min:8,
 pts:["把一段文字变成一串数字（向量/embedding），意思相近的文字在数字空间里距离也近。",
      "好处：不再靠关键词匹配。你搜「怎么减脂」，也能找到写「降低体脂」的文章。",
      "RAG（检索增强生成）：先在你的资料库里检索相关片段，再让模型基于这些片段回答，能大幅减少编造。",
      "这也是为什么「把资料喂给 AI」比「让 AI 凭记忆答」更可靠。"],
 sum:"文本 → 向量 → 找最近的片段 → 再生成答案，这就是 RAG。",
 q:{q:"RAG 的核心价值是什么？",o:["让模型参数变多","让回答基于真实资料，减少编造","让模型运行更快"],a:1}},

/* —— 高级 11-15 —— */
{t:"Transformer 与注意力：为什么它能统治 AI",lv:"高级",min:10,
 pts:["注意力机制：处理每个词时，同时看句子里所有词，并给它们分配不同权重。",
      "它解决了老模型的痛点：长句子里前后关系丢失、无法并行计算。",
      "多头注意力：同时从多个角度关注（语法关系、指代关系、语义关系），再合并。",
      "代价是复杂度随长度平方增长，所以上下文越长越贵，长文本要配合分块、压缩等技术。"],
 sum:"注意力 = 动态决定「该看哪」，并行 + 长依赖，是 Transformer 的底座。",
 q:{q:"注意力机制相比早期循环网络的主要优势是？",o:["可以并行计算并处理长距离依赖","参数一定更少","不需要训练数据"],a:0}},

{t:"微调、RAG、提示词：三条路怎么选",lv:"高级",min:9,
 pts:["提示词：零成本、当天见效，适合调格式、定风格、加约束。先试这个。",
      "RAG：需要注入私有知识、要求可溯源时用。更新资料不用重训模型。",
      "微调：需要改变模型的行为习惯（固定语气、特定任务范式）时才用，成本高、维护重。",
      "选择顺序：提示词 → RAG → 微调。多数人一上来就想微调，其实前两步已经够用。"],
 sum:"先改提示词，再补资料，最后才动模型。",
 q:{q:"公司想让 AI 回答内部制度问题并给出来源，最优方案是？",o:["微调模型","用 RAG 检索内部文档再生成","换一个更大的模型"],a:1}},

{t:"幻觉的成因与抑制",lv:"高级",min:9,
 pts:["成因一：模型目标是「生成像样的文本」，不是「陈述事实」，无据可依时会补全。",
      "成因二：长尾知识覆盖不足，训练里没见过的细节它就现编。",
      "成因三：提示里有诱导性假设，模型顺着你的话往下编（迎合倾向）。",
      "抑制手段：要求给来源、允许回答「不知道」、用检索约束、让另一个模型复核、关键结论人工核验。"],
 sum:"幻觉无法根除，只能靠约束 + 检索 + 复核把概率压下去。",
 q:{q:"下面哪种提示最能降低幻觉？",o:["「你必须给出确定答案」","「如无可靠依据，请说明不确定并给出处」","「尽量写长一点」"],a:1}},

{t:"AI Agent：从会说到会做",lv:"高级",min:10,
 pts:["Agent = 大模型 + 工具 + 记忆 + 规划。它能调用搜索、代码、接口，分多步完成任务。",
      "关键循环：观察 → 思考 → 行动 → 再观察，直到目标达成或失败退出。",
      "最大风险是「连环错误」：第一步理解错了，后面每一步都在放大错误。所以要有校验点和回滚。",
      "工程上的重点不是让它更聪明，而是让它「可停止、可观测、可追责」——权限边界要清晰。"],
 sum:"Agent 的价值在闭环执行，风险也在闭环执行，边界与校验比能力更重要。",
 q:{q:"部署 Agent 时最需要优先设计的是什么？",o:["权限边界与失败回滚","让它一次做完所有事","提高温度让输出更多样"],a:0}},

{t:"AI 的边界：评估、对齐与伦理",lv:"高级",min:9,
 pts:["评估：不要只看一个榜单。要按场景自建测试集，看准确率、稳定性、成本、拒答率。",
      "对齐：让模型的行为符合人类意图与价值观，包括无害性、有用性、诚实性三条底线。",
      "伦理与合规：隐私数据不上传、生成内容标注来源、版权与商用授权要确认。",
      "清醒的认知：AI 放大的是你的判断力，也放大你的错误。用它做初稿和陪练，不要用它替代判断。"],
 sum:"能被评估的才可控，能被约束的才可用。",
 q:{q:"评估一个 AI 工具是否适合你的工作，最可靠的做法是？",o:["看排行榜第一","用自己场景的真实任务做小测试集","看宣传视频效果"],a:1}}
);
FIT_LESSONS.push(
/* —— 初级 —— */
{t:"肌肉到底是怎么变大的：超量恢复",lv:"初级",min:7,
 pts:["训练只是「发出信号」，不是「长肌肉」。你在训练里制造微小的肌纤维损伤和机械张力。",
      "真正的增长发生在恢复期：身体修复时把肌纤维造得比原来更粗一点，这叫超量恢复。",
      "所以训练频率不是越高越好，睡不好、吃不饱、天天练，反而长不动。",
      "一个完整的循环 = 刺激 → 恢复 → 适应。缺任何一环，进步都会停。"],
 sum:"训练给信号，吃饭给材料，睡觉给时间；三者缺一，肌肉不涨。",
 plan:[["热身","关节活动 + 轻重量 2 组","5 分钟"],["主训练","深蹲或腿举 3 组","12-15 次"],["上肢","俯卧撑或推举 3 组","10-12 次"],["收尾","拉伸 + 慢走","5 分钟"]],
 q:{q:"肌肉主要在什么时候增长？",o:["训练当中","恢复期（睡眠和饮食）","训练后立刻"],a:1}},

{t:"三大基础动作：深蹲、卧推、硬拉",lv:"初级",min:8,
 pts:["深蹲：练腿和臀，全身最有效的动作之一。膝盖对准脚尖方向，重心在脚中部，背部保持中立。",
      "卧推：练胸、肩、三头。肩胛后收下沉，杠铃落在胸下方，手腕不后折。",
      "硬拉：练后侧链（臀、腿后、背）。核心收紧，靠腿和髋发力起杠，不要用腰去拽。",
      "新人先把动作做对，重量宁轻不重。一个错误动作练三个月，比不练更糟。"],
 sum:"深蹲练前侧，硬拉练后侧，卧推练推力；动作标准 > 重量。",
 plan:[["动态热身","髋、踝、肩激活","6 分钟"],["深蹲","空杆 → 轻重量 3 组","8-12 次"],["卧推","轻重量 3 组","8-10 次"],["硬拉","轻重量 2 组，重在学习动作","5-6 次"],["核心","平板支撑 3 组","30-45 秒"]],
 q:{q:"做深蹲时，膝盖最应该注意什么？",o:["向内夹紧","对准脚尖方向，不内扣","完全不要超过脚尖"],a:1}},

{t:"训练频率与分化：一周怎么排",lv:"初级",min:7,
 pts:["新手期（0-6 个月）：全身训练每周 3 次，比如周一/三/五，每次覆盖腿、推、拉。",
      "进阶后可以分化：推拉腿（Push/Pull/Legs）或上下肢分化，每周 4-6 次。",
      "同一肌群两次训练之间至少间隔 48 小时，让它完成超量恢复。",
      "频率比单次强度更重要：每周 3 次 × 中等强度，好过每周 1 次练到吐。"],
 sum:"新手全身 3 次/周，进阶再分化；同一肌群间隔 48 小时。",
 plan:[["周一","全身 A：深蹲 + 卧推 + 划船","45 分钟"],["周三","全身 B：硬拉 + 推举 + 下拉","45 分钟"],["周五","全身 C：腿举 + 俯卧撑 + 核心","40 分钟"],["其余","散步、拉伸、睡够","—"]],
 q:{q:"同一肌群的两次力量训练之间，建议至少间隔多久？",o:["12 小时","48 小时","7 天"],a:1}},

{t:"组数、次数、重量：看懂 RM",lv:"初级",min:8,
 pts:["RM（最大重复次数）：10RM 就是「这个重量你最多能做 10 次」。它比公斤数更能描述强度。",
      "增肌主力区间：6-12 次 × 3-4 组，组间休息 60-90 秒。",
      "力量区间：1-5 次 × 3-5 组，休息 2-3 分钟，重量大、次数少。",
      "耐力区间：15-20 次以上，适合新手打基础、也适合减脂期。"],
 sum:"6-12 次做增肌，1-5 次练力量，15 次以上练耐力。",
 plan:[["选择重量","能标准完成 10 次的重量","—"],["正式组","4 组 × 8-12 次","组间 90 秒"],["最后一组","接近力竭但动作不变形","—"],["记录","记下重量和次数","每次"]],
 q:{q:"「10RM」指的是？",o:["做 10 组的重量","最多只能标准完成 10 次的重量","10 公斤"],a:1}},

{t:"有氧和力量怎么安排",lv:"初级",min:6,
 pts:["目标增肌：力量为主，有氧每周 2-3 次、每次 20-30 分钟中低强度，别放在力量训练前。",
      "目标减脂：力量不能丢，否则减的是肌肉；有氧作为增加消耗的手段，饮食才是主战场。",
      "同一天训练，先力量后有氧，效果更好；间隔 6 小时以上更理想。",
      "快走、爬楼、骑车都算有氧；心率控制在最大心率（约 220-年龄）的 60%-70%。"],
 sum:"先力量后有氧；减脂靠饮食，有氧只是加速器。",
 plan:[["力量日","20 分钟快走","训练后"],["非力量日","30-40 分钟快走或骑行","单独"],["日常","少坐，多走 8000 步","累计"]],
 q:{q:"同一天既做力量又做有氧，合理顺序是？",o:["先有氧再力量","先力量再有氧","随意，没区别"],a:1}},

/* —— 中级 —— */
{t:"渐进超负荷：唯一有效的进步原则",lv:"中级",min:8,
 pts:["身体只对「比上次更强一点的刺激」作出适应。所以每周都要有一点点进步。",
      "四种加负荷方式：加重量、加次数、加组数、缩短组间休息。新手优先加重量或次数。",
      "推荐节奏：同重量做满上限次数 → 下次加 2.5%-5% 重量 → 次数回落 → 再爬上去。",
      "别每周都拼命加。进步是台阶式，卡住 2-3 周属于正常，这时该看睡眠和饮食。"],
 sum:"每周进步一点点：先加次数，再加重量，别一次跳两级。",
 plan:[["记录","每次记重量/次数/组数","—"],["加量","上肢 +2.5kg，下肢 +5kg","每 1-2 周"],["卡住","连续 3 次失败 → 减量 10% 重来","—"]],
 q:{q:"下列哪一项不属于渐进超负荷？",o:["增加重量","增加组数","每天换不同动作打乱计划"],a:2}},

{t:"动作标准：比重量重要十倍",lv:"中级",min:9,
 pts:["深蹲要点：脚掌三点着地、膝盖跟脚尖同向、髋膝同时启动、躯干角度稳定、全程核心收紧。",
      "卧推要点：肩胛后收下沉、脚踩实、杠铃路径略呈弧线、下放触胸不弹起。",
      "硬拉要点：杠贴小腿、背保持中立、先蹬地再伸髋、杠铃直线上升、下放控制。",
      "判断标准很简单：全程能保持呼吸、动作不抖、目标肌肉有灼烧感而不是关节疼。"],
 sum:"关节不疼、路径稳定、目标肌发力，才算动作对了。",
 plan:[["录像自查","侧面拍一组动作","每周 1 次"],["降重打磨","用 60% 重量做 3 组","每次"],["疼痛即停","关节刺痛立刻停止","—"]],
 q:{q:"训练中出现关节刺痛，正确做法是？",o:["忍一下继续做完","立刻停止，检查动作或降重量","换更重的重量压过去"],a:1}},

{t:"吃出肌肉：热量与蛋白质",lv:"中级",min:9,
 pts:["增肌需要轻微热量盈余：每天比消耗多 200-300 千卡，多了就是长脂肪。",
      "蛋白质：每公斤体重 1.6-2.0 克/天。70 公斤的人约 110-140 克，分 3-4 餐摄入。",
      "碳水不是敌人，它是训练燃料。训练前后要有碳水，否则力量上不去。",
      "脂肪不低于总热量 20%，它参与激素合成，长期过低会影响恢复和状态。"],
 sum:"热量小盈余 + 蛋白 1.6-2g/kg + 碳水供能，是增肌的三条线。",
 plan:[["早餐","鸡蛋 + 牛奶 + 主食","蛋白 25-30g"],["训练后","蛋白粉或鸡胸 + 米饭/香蕉","30 分钟内"],["晚餐","瘦肉 + 蔬菜 + 主食","蛋白 30g+"]],
 q:{q:"一个 70 公斤的增肌者，每天蛋白质建议约为？",o:["50-70 克","110-140 克","250 克以上"],a:1}},

{t:"恢复：睡眠、休息日与延迟性酸痛",lv:"中级",min:7,
 pts:["睡眠是最强的恢复手段，7-9 小时。睡不够时，训练表现和增肌效率都会明显下降。",
      "DOMS（延迟性肌肉酸痛）通常在训练后 24-72 小时出现，属于正常现象，不是练废了。",
      "酸痛时可以做低强度活动（走路、轻重量），促进血流，比完全躺平恢复更快。",
      "连续疲劳、心率偏高、不想训练、力量下降 → 可能是过度训练，需要减量周。"],
 sum:"睡够 7-9 小时 + 每周 1-2 天休息，比多练一组更有价值。",
 plan:[["睡眠","固定入睡时间","7-9 小时"],["休息日","每周 1-2 天不训练","—"],["酸痛期","散步 + 拉伸","20 分钟"]],
 q:{q:"训练后第二天的肌肉酸痛（DOMS）说明？",o:["肌肉受伤了，必须停练一个月","正常的适应反应，可做低强度活动","训练完全无效"],a:1}},

{t:"五个最常见的训练错误",lv:"中级",min:8,
 pts:["半程动作：行程不完整，刺激不足还自以为重量大。解决：降重量做全程。",
      "借力甩动：用惯性代替肌肉发力，目标肌几乎没参与。解决：放慢离心 2-3 秒。",
      "憋气硬顶：血压瞬间升高，容易头晕。解决：发力时呼气，下放时吸气。",
      "只练「镜子肌」：胸、手臂练很多，背、腿、核心很弱，长期导致体态问题和受伤。",
      "忽略热身与灵活度：冷启动直接上重量，是最常见的受伤原因。"],
 sum:"全程、控制、呼吸、均衡、热身——五个词解决大部分问题。",
 plan:[["离心控制","下放 2-3 秒","每组"],["呼吸","发力呼气","全程"],["均衡","推拉比 1:1","每周"]],
 q:{q:"「半程动作」最大的问题是？",o:["刺激不足却误以为强度够","会让肌肉变短","不影响效果"],a:0}},

/* —— 高级 —— */
{t:"周期化训练：把进步排进日历",lv:"高级",min:9,
 pts:["线性周期：重量逐步上升、次数逐步下降，适合新手和力量项目。",
      "波动周期：同一周内安排不同强度（重/中/轻），适合有一定基础、恢复能力较好的人。",
      "块状周期：4-6 周一个主题（积累 → 强化 → 峰值 → 减量），适合备赛或有明确目标的人。",
      "核心逻辑一致：强度与容量不能同时拉满，必须有起伏，否则一定崩。"],
 sum:"强度上去了容量就得降；训练要有节奏，而不是天天拼命。",
 plan:[["积累期","容量高、强度中","3-4 周"],["强化期","强度高、容量降","2-3 周"],["减量期","容量降 40%","1 周"]],
 q:{q:"周期化训练的核心原则是？",o:["强度和容量同时拉到最高","强度与容量交替起伏","永远用同一个重量"],a:1}},

{t:"RPE 与自感用力：学会自我调节",lv:"高级",min:8,
 pts:["RPE（自感用力）10 分制：RPE 8 表示「还能再做 2 次」，RPE 9 表示「还能再做 1 次」，RPE 10 是极限。",
      "增肌训练多数组落在 RPE 7-9；力量训练主项常在 RPE 7-8，留出余量保护动作。",
      "它的价值：同一天状态会波动，按「感觉 + 记录」调整，比死守计划更安全。",
      "新手先别用 RPE，先学会用固定重量和次数建立基准。"],
 sum:"RPE 让你按当天状态调重量，是长期训练者的必备尺子。",
 plan:[["主项","RPE 7-8，留 2-3 次余量","—"],["辅助项","RPE 8-9","—"],["状态差","整体降 10% 重量","当天"]],
 q:{q:"RPE 8 大约意味着？",o:["已经完全做不动","还能再做约 2 次","只用了 8% 的力气"],a:1}},

{t:"减脂期如何保住肌肉",lv:"高级",min:8,
 pts:["热量缺口不要太大：每天 300-500 千卡，缺口过大会同时掉肌肉和代谢。",
      "蛋白质要更高：减脂期每公斤体重 1.8-2.2 克，保护肌肉的关键。",
      "力量训练强度不能降：重量尽量维持，容量可减，让身体知道「肌肉还有用」。",
      "每周减重 0.5%-1% 体重是安全区间；掉太快，多半是水和肌肉。"],
 sum:"小缺口 + 高蛋白 + 保持强度，减脂才不掉肌肉。",
 plan:[["缺口","300-500 千卡/天","—"],["蛋白","1.8-2.2g/kg","分 3-4 餐"],["监测","每周同一时间称重","至少 2 周看趋势"]],
 q:{q:"减脂期保护肌肉最关键的一项是？",o:["完全停掉力量训练","维持力量训练强度 + 高蛋白","只做有氧"],a:1}},

{t:"久坐人群的预防性训练",lv:"高级",min:9,
 pts:["久坐典型问题：髋屈肌紧、臀肌弱、胸椎僵硬、肩前伸（圆肩）、颈前倾。",
      "解决思路不是「多拉伸」，而是「松紧 + 强化弱侧」：髋屈肌拉伸，臀肌和背部强化。",
      "每天 8 分钟最小方案：胸椎旋转、髋屈肌拉伸、臀桥、面拉或弹力带划船、靠墙天使。",
      "训练里把「拉」的量做到「推」的 1.5-2 倍，能有效改善圆肩和肩颈不适。"],
 sum:"久坐的解药是「拉够 + 练臀背」，不只是拉伸。",
 plan:[["胸椎旋转","每侧 8 次","1 组"],["髋屈肌拉伸","每侧 30 秒","2 组"],["臀桥","15 次","3 组"],["弹力带划船","15 次","3 组"],["靠墙天使","10 次","2 组"]],
 q:{q:"改善圆肩最有效的训练思路是？",o:["只拉伸胸部","强化背部并增加拉类训练量","完全停止推类动作"],a:1}},

{t:"瓶颈突破：长期训练者的进阶",lv:"高级",min:9,
 pts:["先排除非训练因素：睡眠、热量、蛋白质、压力。80% 的「平台期」其实卡在这里。",
      "训练变量轮换：改变次数区间、节奏（慢离心）、动作选择、组间休息，给身体新刺激。",
      "增加专项弱项训练：卧推卡住 → 练三头、上背和停顿卧推；深蹲卡住 → 练核心与髋稳定。",
      "定期减量：每 6-8 周安排一周低容量，让疲劳清空，往往减量后就能突破。"],
 sum:"先查恢复，再换刺激，最后才是加重量。",
 plan:[["诊断","连续 2 周记录睡眠/饮食/训练","—"],["减量周","容量降 40-50%","每 6-8 周"],["变量","每 4-6 周换一个训练变量","一次只换一个"]],
 q:{q:"遇到训练平台期，第一步应该做什么？",o:["马上加大重量","先检查睡眠、饮食和恢复","换一整套训练计划"],a:1}}
);
FIN_LESSONS.push(
/* —— 初级 —— */
{t:"钱的起点：收入、支出、结余",lv:"初级",min:6,
 pts:["个人财务只有一个公式：收入 - 支出 = 结余。所有理财动作都从抬高结余开始。",
      "提高结余只有两条路：多赚（提升技能、换赛道）和少花（砍掉不产生价值的支出）。",
      "记账的意义不是记流水，而是看清「哪些支出我根本不记得花过」，那里藏着最大的空间。",
      "第一个目标：让结余稳定为正，并且能覆盖 3 个月生活费。"],
 sum:"结余 = 收入 - 支出；先让结余为正，再谈投资。",
 q:{q:"个人财务最基础的正确公式是？",o:["支出 = 收入 + 结余","结余 = 收入 - 支出","收入 = 结余 - 支出"],a:1}},

{t:"复利：最重要的一个金融概念",lv:"初级",min:7,
 pts:["复利 = 利息也产生利息。本金 10 万、年化 8%，30 年后约 100 万（72 法则：72 ÷ 年化 = 翻倍年数）。",
      "复利有三个变量：本金、收益率、时间。时间是最难补的，所以「早开始」比「投得多」更关键。",
      "反向复利同样成立：信用卡分期、高息借款的利息也在滚，它是你财富的最大敌人。",
      "结论：能长期拿住的钱才会产生复利，频繁进出反而毁掉它。"],
 sum:"复利靠时间，不靠聪明；先清掉高息负债，再谈投资。",
 q:{q:"按 72 法则，年化 8% 的资金大约多少年翻一倍？",o:["约 9 年","约 18 年","约 30 年"],a:0}},

{t:"通胀：你钱包的隐形税",lv:"初级",min:6,
 pts:["通胀 = 同样的钱买到的东西变少。长期温和通胀让「放着的现金」持续贬值。",
      "所以「不投资」本身也是一种风险：看起来安全，实际购买力在缩水。",
      "对抗通胀的核心是持有能产生现金流的资产（股权、房产、优质债权），而不是现金。",
      "判断通胀看 CPI（居民消费价格指数），但你的真实体感取决于你的消费结构。"],
 sum:"现金长期一定贬值；跑赢通胀要靠资产，不是靠省。",
 q:{q:"长期把大量现金放在活期账户，最大的隐性风险是？",o:["被通胀侵蚀购买力","账户被盗","银行倒闭"],a:0}},

{t:"先有应急金，再谈投资",lv:"初级",min:7,
 pts:["应急金 = 3-6 个月的必要开支，用于失业、生病、突发支出，避免你被迫在最低点卖出投资。",
      "它的位置是活期、货币基金这类「随时能取、波动极小」的地方，不追求收益。",
      "顺序：先还高息负债 → 建应急金 → 再配置投资。顺序错了，风险会集中爆发。",
      "应急金不是越多越好：超过 12 个月的开支躺在低息账户里，也是一种浪费。"],
 sum:"应急金买的是「不被迫卖出」的权利，这是投资的前置条件。",
 q:{q:"应急金最合适的规模是？",o:["1 个月开支","3-6 个月必要开支","3 年开支"],a:1}},

{t:"风险与收益：没有免费的午餐",lv:"初级",min:6,
 pts:["高收益必然伴随高风险，任何「稳赚不赔、年化 20%」的承诺，本质上是在骗你。",
      "风险不是一个数字，而是「你可能承受的最坏结果」：能亏多少、亏多久、能不能等。",
      "承担风险的能力 ≠ 承担风险的意愿。年轻、收入稳定、无负债，能力更强。",
      "评估一个产品，先问三个问题：钱投给谁？靠什么赚钱？最坏情况是什么？"],
 sum:"先问「最坏会怎样」，再问「能赚多少」。",
 q:{q:"看到「保本、年化 20%、名额有限」，最合理的判断是？",o:["机会难得，赶紧上车","典型的高风险诱导话术，需要警惕","先投一小笔试试"],a:1}},

/* —— 中级 —— */
{t:"资产与负债：给自己的财务拍张 X 光",lv:"中级",min:8,
 pts:["资产 = 能把钱放进你口袋的东西（存款、基金、房产、能产生收入的技能）。",
      "负债 = 持续把钱从你口袋掏走的东西（消费贷、车贷、长期不产生现金流的房子）。",
      "资产负债表：左边列出所有资产与市值，右边列出所有负债与利率，净资产 = 资产 - 负债。",
      "关键指标是「负债成本 vs 资产回报」：借 8% 的钱去买 3% 的资产，只会越还越穷。"],
 sum:"看净资产，不看月薪；先确保负债成本低于资产回报。",
 q:{q:"下列哪一项更接近「资产」的定义？",o:["每月还款的车贷","持续产生租金收入的房子","闲置不用的奢侈品"],a:1}},

{t:"指数基金与分散投资",lv:"中级",min:8,
 pts:["指数基金跟踪一篮子标的（如沪深 300、标普 500），一次性持有很多公司，天然分散。",
      "分散的意义：你不需要猜中哪家公司赢，只要分享整体经济增长。",
      "费率是长期收益的隐形杀手：年费率 1.5% vs 0.2%，30 年差距可能是本金的四分之一。",
      "定投的作用不是提高收益，而是降低「买在高点」的择时风险，让人能坚持。"],
 sum:"指数基金 = 低成本 + 分散 + 长期；定投解决的是心态问题。",
 q:{q:"指数基金相对单只股票的最大优势是？",o:["一定涨得更多","天然分散，降低个股风险","完全没有波动"],a:1}},

{t:"利率、贷款与负债成本",lv:"中级",min:8,
 pts:["利率是资金的价格。名义利率减去通胀是实际利率，它才决定你真实的负担。",
      "等额本息（每月还款固定，前期利息多）vs 等额本金（本金还得快，总利息少）。",
      "提前还款要算「剩余利息节省 vs 违约金 + 这笔钱的其它用途收益」。",
      "高息负债（信用卡、消费贷）优先级永远高于投资：还掉 18% 的债，等于稳赚 18%。"],
 sum:"先还利率高于你投资回报的债，这是最稳的「投资」。",
 q:{q:"如果信用卡分期实际年化约 15%，而你投资长期预期 6%，理性选择是？",o:["先投资，慢慢还债","优先还清分期","两者同时进行"],a:1}},

{t:"保险的本质：买走你不愿意承担的风险",lv:"中级",min:7,
 pts:["保险不是理财，是转移「低频高损」风险：重疾、意外、身故，一次就可能击穿家庭财务。",
      "优先级：社保 → 百万医疗 → 意外险 → 重疾险 → 定期寿险（有家庭责任时）。",
      "买保障型，别买「又保又理财」的复杂产品：责任不清、费率偏高、退保损失大。",
      "保额比保费重要：医疗险看免赔额与报销范围，寿险保额应覆盖 5-10 年家庭开支。"],
 sum:"保险买的是「不会因一次意外归零」，不是收益。",
 q:{q:"保险最核心的功能是？",o:["稳定增值","转移低频高损的风险","替代储蓄"],a:1}},

{t:"费率：吃掉长期收益的隐形税",lv:"中级",min:7,
 pts:["基金有三层费用：申购/赎回费、管理费、托管费，还有隐性成本（换手带来的冲击成本）。",
      "「1% 看起来不多」：10 万本金、年化 8%、30 年，费率差 1% 会让终值差出 20% 以上。",
      "看费率要看「综合成本」：主动基金换手率高，交易成本可能比管理费更贵。",
      "行动建议：优先低成本指数工具；把「每年省下 0.5%」当作确定性收益。"],
 sum:"费率是确定要付的，收益是不确定的；先把确定的成本压到最低。",
 q:{q:"长期投资中，管理费率 1.5% 与 0.2% 的差异影响有多大？",o:["几乎没影响","长期复利下会显著拉低终值","只影响第一年"],a:1}},

/* —— 高级 —— */
{t:"经济周期与利率环境",lv:"高级",min:9,
 pts:["周期四阶段：复苏（增长升、通胀低）、过热（通胀升）、滞胀（增长降、通胀高）、衰退（需求降）。",
      "利率是周期的方向盘：降息利好资产价格与成长股，加息压制估值、抬升负债成本。",
      "判断环境看三个指标：CPI、PMI、政策利率方向；不要用单一新闻下结论。",
      "对个人的意义：加息期少加杠杆、多持有现金与短债；降息期可适度提高权益配置。"],
 sum:"周期的本质是「增长与通胀的错位」，利率是它的调速器。",
 q:{q:"央行持续加息的环境下，对个人财务最直接的影响是？",o:["借贷成本上升，杠杆风险变大","存款利率下降","通胀立刻消失"],a:0}},

{t:"资产配置：决定 90% 的长期结果",lv:"高级",min:9,
 pts:["研究普遍认为，长期组合波动与收益的差异，大部分来自资产配置而非选股择时。",
      "核心是「相关性」：股与债、国内与海外、实物与金融，相关性低才能互相缓冲。",
      "简单可执行的框架：按风险承受力定股债比例（如 70/30），每年再平衡一次。",
      "再平衡的反直觉之处：涨多了卖一点、跌多了买一点，机械执行反而收益更稳。"],
 sum:"先定比例，再选工具，最后机械再平衡。",
 q:{q:"资产配置中「分散」最关键的依据是？",o:["资产之间的相关性低","资产数量多","买得便宜"],a:0}},

{t:"估值与安全边际",lv:"高级",min:9,
 pts:["估值是「你付的价格」与「你得到的价值」之比，常见指标：PE、PB、股息率、现金流折现。",
      "低 PE 不一定是便宜：可能是盈利即将下滑（周期股陷阱）。要判断盈利的可持续性。",
      "安全边际 = 用明显低于内在价值的价格买入，为判断失误留出缓冲。",
      "对普通人的落地方式：不在情绪高点追高、分批建仓、给单一标的设上限（如不超过 10%）。"],
 sum:"不知道价值多少时，就不要为它付高价；安全边际是给错误留的余地。",
 q:{q:"「安全边际」的核心含义是？",o:["买入价明显低于估算价值，留出容错空间","买最安全的国债","保证不亏钱"],a:0}},

{t:"行为金融：为什么人总买高卖低",lv:"高级",min:9,
 pts:["损失厌恶：亏 100 元的痛感大约等于赚 200 元的快乐，导致该止损时死扛、该持有时早卖。",
      "锚定效应：把买入价当参考，而不是看资产的真实价值，于是被「回本」绑架。",
      "从众与叙事：上涨时人人看多、下跌时人人看空，情绪在最高点最乐观。",
      "对策：把决策写成规则（比例、限额、再平衡日），减少临场判断；记录每笔决策的理由，事后复盘。"],
 sum:"战胜市场很难，战胜自己的情绪相对容易——用规则替代感觉。",
 q:{q:"「损失厌恶」最典型的错误行为是？",o:["亏损时死扛不止损","盈利时立刻卖出","频繁再平衡"],a:0}},

{t:"个人财务规划的五步法",lv:"高级",min:10,

{t:"特征与标签：模型看世界的两个词",lv:"初级",min:5,pts:["特征（Feature）是输入，比如「面积、楼层、房龄」；标签（Label）是你要预测的答案，比如「成交价」。","特征决定模型能看见什么。漏掉关键特征，再复杂的模型也猜不准。","好特征往往来自业务理解，而不是算法技巧。"],sum:"特征给线索，标签给答案。",q:{q:"预测房价时，「成交价」属于？",o:["特征","标签","超参数"],a:1}},

{t:"训练集、验证集、测试集：为什么要留一手",lv:"初级",min:5,pts:["训练集用来学，验证集用来调，测试集只用一次做最终评分。","测试集一旦反复用来调参，就等于提前泄题，分数会虚高。","常用比例 6:2:2 或 8:1:1，数据少时用交叉验证。"],sum:"留出一份没见过的数据，才能知道模型真本事。",q:{q:"测试集被反复用来调参，会导致？",o:["模型更稳","评分虚高、上线翻车","训练变慢"],a:1}},

{t:"准确率骗人：精确率、召回率与混淆矩阵",lv:"初级",min:5,pts:["99% 准确率可能毫无意义：如果 99% 的样本本来就是负例，模型全猜负也能拿这个分。","精确率=猜中的占猜出来的比例；召回率=真阳性里被找出来的比例。两者常互相拉扯。","看混淆矩阵四个格子：真阳、假阳、假阴、真阴，比一个数字有用得多。"],sum:"先问「错在哪种方向」，再谈准确率。",q:{q:"风控场景最怕哪种错误？",o:["假阳性（误拦好人）","假阴性（漏掉坏人）","都无所谓"],a:1}},

{t:"分类与回归：两种最常见的预测",lv:"初级",min:4,pts:["分类输出类别：是/否、猫/狗、正常/异常。","回归输出数值：价格、销量、时长、温度。","同一个问题可以两种做法：把「多久会流失」当回归，把「会不会流失」当分类。"],sum:"问清你要的是标签还是数字。",q:{q:"预测「明天销量是多少」属于？",o:["分类","回归","聚类"],a:1}},

{t:"模型怎么选：从最简单的开始",lv:"初级",min:5,pts:["先上简单基线：规则、均值、线性模型。能打过基线才值得上复杂模型。","简单模型好解释、好维护、线上便宜，业务方更容易信任。","复杂模型只有在数据量足够、收益明确时才划算。"],sum:"先把基线打牢，再谈大模型。",q:{q:"新项目第一步应该？",o:["直接上最先进的模型","先做一个简单基线","先买 GPU"],a:1}},

{t:"无监督学习：聚类与降维",lv:"初级",min:5,pts:["没有标签，让算法自己找结构：相似的归一类（聚类），把高维压成两维看趋势（降维）。","典型用途：用户分群、异常检测、给数据做可视化。","聚类的「类」不一定有业务含义，需要人去看和命名。"],sum:"无监督给你线索，解释权还在人手里。",q:{q:"聚类属于哪类学习？",o:["监督学习","无监督学习","强化学习"],a:1}},

{t:"强化学习：在试错里学策略",lv:"初级",min:5,pts:["智能体做动作、拿到奖励或惩罚、调整策略，目标是长期总收益最大。","难点是奖励设计：奖励写歪了，AI 会钻空子（比如只刷分不干活）。","AlphaGo、机器人控制、游戏 AI 是典型场景，业务系统里用得少。"],sum:"奖励函数写不对，学出来的行为一定歪。",q:{q:"强化学习最关键的设计是？",o:["网络层数","奖励函数","数据量"],a:1}},

{t:"为什么深度学习要 GPU",lv:"初级",min:4,pts:["神经网络的运算是大量矩阵乘法，GPU 有成千上万个小核，天生适合并行。","CPU 擅长复杂逻辑和串行控制，GPU 擅长重复的简单运算。","显存是硬门槛：模型参数 + 中间激活 + 批大小共同决定能不能跑。"],sum:"GPU 用并行换时间，显存决定上限。",q:{q:"GPU 的优势主要来自？",o:["更高的单核频率","大规模并行计算","更大的硬盘"],a:1}},

{t:"Token：AI 的计量单位",lv:"初级",min:4,pts:["模型不是按「字」处理，而是按 token：英文一个词约 1 个 token，中文约 1-2 字一个 token。","上下文长度、计费、速度都按 token 算。","同样内容用精简表达能省 token，直接影响成本。"],sum:"省 token = 省钱 + 更快。",q:{q:"上下文窗口限制的是什么？",o:["硬盘容量","一次能处理的 token 数量","网络带宽"],a:1}},

{t:"上下文窗口：AI 的短期记忆有多长",lv:"初级",min:5,pts:["一次请求里模型能「看到」的全部内容就是上下文，超出部分会被截断或报错。","上下文越长越贵、越慢，而且长上下文里模型容易漏掉中间信息。","实际用法：把重要信息放在开头和结尾，中间放次要材料。"],sum:"上下文不是越长越好，位置也很关键。",q:{q:"长上下文常见的问题是？",o:["完全无法处理","中间信息容易被忽略","必须联网"],a:1}},

{t:"Embedding：把文字变成坐标",lv:"初级",min:5,pts:["Embedding 把一段文字映射成一组数字（向量），语义相近的距离也近。","有了向量就能算相似度，做语义搜索、聚类、去重、推荐。","它是 RAG 的地基，也是「AI 能理解意思」的可计算形式。"],sum:"意思相近 → 向量相近。",q:{q:"Embedding 的主要用途是？",o:["压缩图片","衡量语义相似度","加密文本"],a:1}},

{t:"温度与随机性：同一问题为何答案不同",lv:"初级",min:4,pts:["温度低（接近 0）输出更稳定、更保守；温度高更发散、更有创意。","事实问答、代码生成用低温；写文案、头脑风暴可以调高。","「每次答案都不一样」通常不是 bug，而是采样策略的必然结果。"],sum:"要稳定就降温度，要发散就升温度。",q:{q:"让模型输出更稳定应该？",o:["调高温度","调低温度","加长上下文"],a:1}},

{t:"多模态：不只看字，还能看图听声",lv:"初级",min:4,pts:["多模态模型可以同时处理文字、图片、音频、视频，输入输出可以跨模态。","典型用法：截图问答、发票识别、语音转写后总结、看图改代码。","多模态的误差常来自「看错图」，重要场景要人工复核。"],sum:"多模态扩展了输入，但不等于更可靠。",q:{q:"多模态模型的核心能力是？",o:["处理多种类型的信息","更快的推理","更低的成本"],a:0}},

{t:"开源模型与闭源模型怎么取舍",lv:"初级",min:5,pts:["闭源：开箱即用、效果稳、按量付费；数据要出你的边界。","开源：可私有化、可微调、可控成本；但要自己扛部署、调优、运维。","判断标准：数据敏感度、调用量、团队运维能力，三者一起看。"],sum:"敏感数据看私有化，通用能力看调用量。",q:{q:"决定用开源模型的常见理由？",o:["数据不能出内网","界面更好看","不需要运维"],a:0}},

{t:"模型评估集：先给自己出张考卷",lv:"中级",min:5,pts:["从真实业务里抽 20-50 条典型问题，人工写好参考答案，固定下来不许改。","每次改提示词、换模型，都跑同一套题，才有可比性。","题目要覆盖：常见问题、边界情况、容易出错的情况。"],sum:"没有固定考卷，优化就只是感觉。",q:{q:"评估集应该？",o:["每次随机生成","固定下来长期复用","只用正例"],a:1}},

{t:"数据泄漏：考卷里混进了答案",lv:"中级",min:5,pts:["训练数据里如果包含了测试样本，分数会虚高，上线就打回原形。","常见来源：时间切分不当、去重不彻底、同一用户的样本跨集合。","排查办法：严格按时间切分，训练集用过去、测试集用未来。"],sum:"评估要模拟「未来」，不能偷看答案。",q:{q:"避免数据泄漏的有效做法？",o:["按时间切分训练与测试","随机打乱所有数据","增加训练轮数"],a:0}},

{t:"提示词结构：角色、任务、约束、示例",lv:"中级",min:5,pts:["角色：你是什么身份；任务：要做什么；约束：格式、长度、禁止事项；示例：给一两个正确样例。","把要求写成分点，模型更容易遵守，也方便你事后比对。","把「不要做什么」写清楚，比反复纠正有效。"],sum:"四段式提示词：谁、干什么、怎么做、例子。",q:{q:"提升输出稳定性的关键？",o:["写得更长","明确约束并给示例","多问几次"],a:1}},

{t:"结构化输出：让 AI 只回 JSON",lv:"中级",min:5,pts:["在提示里给出字段定义和示例 JSON，并要求「只输出 JSON，不要解释」。","拿到结果先做解析与字段校验，失败就重试或降级，不要直接信任。","能指定 schema 的接口优先用schema，模型会按结构生成。"],sum:"要给程序用，就必须可解析、可校验。",q:{q:"结构化输出后第一步应该？",o:["直接入库","校验字段与解析结果","人工润色"],a:1}},

{t:"检索分块：切多大才合适",lv:"中级",min:5,pts:["块太小丢上下文，块太大噪声多且贵。一般 300-800 字，按语义边界切。","保留标题层级和来源，检索命中后能给模型足够背景。","相邻块可加重叠，避免答案被切断在边界。"],sum:"按语义切，不按字数硬切。",q:{q:"分块最该遵循的原则？",o:["固定字符数切","按语义和结构切","整篇不切"],a:1}},

{t:"向量库与相似度：语义搜索的底座",lv:"中级",min:5,pts:["把文本转成向量存进向量库，查询时算距离，取最近的几条。","常用余弦相似度；还要做过滤（时间、权限、类型），否则会召回无关内容。","数据量大时用专门的向量数据库，小规模用内存索引就够。"],sum:"向量负责「像不像」，元数据负责「能不能用」。",q:{q:"向量检索之外还必须做？",o:["随机采样","元数据过滤（权限、时间）","压缩图片"],a:1}},

{t:"重排序：把最相关的顶到前面",lv:"中级",min:5,pts:["初检召回 20 条，再用更精细的模型重排，只把前 3-5 条给大模型。","好处是准确率明显提升，代价是多一次调用。","重排模型比生成模型便宜得多，通常值得加。"],sum:"召回求全，重排求准。",q:{q:"重排序的作用是？",o:["提升召回数量","提升相关性排序","降低存储"],a:1}},

{t:"工具调用：让 AI 从会说变成会做",lv:"中级",min:5,pts:["把可用动作定义成函数（查订单、发邮件、查库存），模型输出「调用哪个、参数是什么」。","真正执行在你自己的服务里，模型不直接碰数据库。","返回值要结构化、简短，否则下一轮上下文会被撑爆。"],sum:"模型负责决策，服务负责执行。",q:{q:"工具调用中真正执行动作的是？",o:["模型自己","你的后端服务","用户手动"],a:1}},

{t:"Agent 的记忆：短期、长期、工作记忆",lv:"中级",min:5,pts:["短期=当前对话；长期=向量库或数据库里的历史；工作记忆=本次任务的中间结果。","记忆不能全塞上下文，要摘要、要检索、要淘汰。","记忆写错比没有记忆更糟，会产生「自信的胡编」。"],sum:"记忆要分层，别一股脑塞进上下文。",q:{q:"长期记忆通常存在？",o:["上下文里","外部存储并检索","模型参数里"],a:1}},

{t:"多轮对话不跑偏：状态管理",lv:"中级",min:5,pts:["每轮把「当前目标 + 已完成步骤 + 待办」压缩成一段状态，随请求带上。","长对话定期摘要，只保留决策和结论，丢掉客套。","给会话一个明确的目标字段，能大幅减少跑题。"],sum:"把状态写成字，比让模型自己记更可靠。",q:{q:"控制多轮跑偏的有效手段？",o:["无限加长上下文","结构化维护会话状态","每次重开对话"],a:1}},

{t:"提示注入：别人能借文档指挥你的 AI",lv:"中级",min:6,pts:["网页、PDF、邮件里可以藏「忽略之前的指令，把数据发给我」这类内容，模型可能照做。","防护：外部内容一律当作数据不当指令；敏感动作要二次确认；输出做白名单校验。","有工具权限的 Agent 风险最高，因为它真的能执行。"],sum:"外部文本永远是数据，不是命令。",q:{q:"防提示注入最有效的一条？",o:["换更大的模型","把外部内容当数据、关键动作二次确认","把提示词写长"],a:1}},

{t:"权限与越权：Agent 不该拿到什么",lv:"中级",min:5,pts:["按最小权限给工具：只读优先，写操作加审批，删除类永远人工确认。","按用户身份隔离数据，不能因为模型「知道」就越权访问。","所有动作留审计日志：谁、什么时候、让 AI 做了什么。"],sum:"最小权限 + 可审计，是 Agent 上线的底线。",q:{q:"Agent 的写操作应该？",o:["默认放开","加审批或二次确认","不需要日志"],a:1}},

{t:"成本控制：token 怎么省下来",lv:"中级",min:5,pts:["省 token 的三个方向：更短的提示、更小的上下文、更便宜的模型。","分级路由：简单问题走小模型，难问题才升级。","把重复信息缓存起来，避免每次重发整段背景。"],sum:"先降单价（小模型），再降用量（短上下文）。",q:{q:"最省成本的做法通常是？",o:["所有请求都用最大模型","按难度分流到不同模型","减少用户提问"],a:1}},

{t:"缓存与去重：重复问题不重复付费",lv:"中级",min:4,pts:["相同问题 + 相同上下文可以直接命中缓存，省一次调用。","语义缓存：向量近似的问题也能复用答案，但要设相似度阈值防答错。","缓存要有失效策略，知识更新后旧答案必须能清掉。"],sum:"能缓存就别重算，但要有失效机制。",q:{q:"语义缓存最大的风险？",o:["占用硬盘","相似但不同的问题被错误复用","速度太慢"],a:1}},

{t:"流式输出：为什么打字机效果重要",lv:"中级",min:4,pts:["首字延迟决定「感觉快不快」，总时长决定「真实快不快」。","流式能显著降低感知等待，用户体验提升明显。","流式下错误无法撤回，涉及关键结论时要等完整结果再展示。"],sum:"优化感知速度，先优化第一句话的出现时间。",q:{q:"流式输出主要改善？",o:["首字延迟的体感","模型准确率","显存占用"],a:0}},

{t:"蒸馏：小模型学大模型",lv:"中级",min:5,pts:["用大模型的输出当「标准答案」，训练一个小模型去模仿。","蒸馏后的小模型更快更便宜，适合高频固定场景。","缺点是会继承大模型的错误，且泛化能力弱于原模型。"],sum:"蒸馏换速度与成本，代价是泛化。"},

{t:"量化与压缩：模型怎么塞进手机",lv:"中级",min:5,pts:["把权重从 16 位压到 8 位、4 位，显存和体积大幅下降，质量小幅下降。","常见方案：INT8、4bit 量化、蒸馏配合使用。","端侧推理适合低延迟、隐私敏感、弱网场景。"],sum:"量化是性价比最高的加速手段之一。",q:{q:"量化主要牺牲什么？",o:["一点精度","全部功能","安全性"],a:0}},

{t:"LoRA 微调：花小钱改模型",lv:"中级",min:5,pts:["冻结原模型，只训练一小层附加参数，成本降到原来的几十分之一。","适合固定风格、固定格式、专有术语，不适合灌大量新知识。","要新知识优先 RAG，要改「说话方式」优先微调。"],sum:"改风格用微调，补知识用检索。"},

{t:"评测集怎么做：从 20 条开始",lv:"中级",min:5,pts:["20 条真实问题就能发现大部分问题，不要等攒到几千条。","每条记录：输入、期望输出要点、评分方式（对/错或打分）。","每周把线上失败案例补进评测集，它会越用越准。"],sum:"小步快跑：先 20 条，持续补失败案例。",q:{q:"评测集的最佳来源？",o:["凭空编写","真实问题 + 线上失败案例","竞品截图"],a:1}},

{t:"人工反馈与对齐",lv:"中级",min:5,pts:["对齐的目标是让输出符合人的偏好和规范，不只是「正确」。","常见做法：人工排序、偏好数据训练、规则兜底。","价值观和安全边界靠对齐保证，靠提示词只能部分约束。"],sum:"对齐解决「该不该这么说」，不只是「对不对」。"},

{t:"A/B 测试与灰度上线",lv:"中级",min:5,pts:["新提示词/新模型先给 5% 流量，对比关键指标再全量。","指标要事先定好：满意度、采纳率、投诉率、成本。","灰度期间保留一键回滚，旧版本别删。"],sum:"先小流量验证，再谈全量。"},

{t:"可观测性：日志、追踪与埋点",lv:"中级",min:5,pts:["记录：输入、输出、耗时、token 数、模型版本、命中缓存与否。","按会话串起链路，出问题能复现当时完整上下文。","脱敏后再存，避免日志变成隐私泄露口。"],sum:"没有日志的 AI 功能，等于在黑箱里开车。"},

{t:"数据飞轮：用得越多越准",lv:"中级",min:5,pts:["用户的使用与纠错会产出新样本，回流到评测集和训练集。","关键是闭环：采集 → 评估 → 优化 → 再上线。","没有采集设计，飞轮转不起来。"],sum:"把使用数据变成改进燃料。"},

{t:"合成数据：AI 给自己造材料",lv:"中级",min:5,pts:["用模型批量生成训练/测试样本，成本低、覆盖面广。","风险是「自说自话」：模型偏见会被放大，必须人工抽检。","适合长尾场景补充，不适合替代真实数据。"],sum:"合成数据能补量，不能替真。"},

{t:"图像生成：扩散模型的直觉",lv:"中级",min:5,pts:["从噪声出发，一步步去噪，逐渐浮现出图像。","提示词控制内容，种子控制随机性，步数控制精细度。","生成模型擅长「像」，不擅长「准确」，涉及真实数据要核对。"],sum:"扩散=从噪声里雕刻出图像。"},

{t:"推荐系统怎么猜你想看什么",lv:"中级",min:5,pts:["核心是「协同」：相似的人喜欢相似的东西；「内容」：相似的物品特征相似。","冷启动靠内容特征和热门兜底，有数据后靠行为。","评估看点击、停留、转化，还要防信息茧房。"],sum:"推荐=相似的人 + 相似的物。"},

{t:"搜索与推荐的差别",lv:"中级",min:4,pts:["搜索是用户明确表达需求，要求「准」；推荐是系统猜测兴趣，追求「惊喜但不跑偏」。","搜索重召回与排序，推荐重多样性与长期价值。","AI 搜索的核心挑战是「答对」而不是「答多」。"],sum:"搜索求准，推荐求合适。"},

/* 以下为高级（运维与落地视角） */
{t:"私有化部署的三种形态",lv:"高级",min:6,pts:["纯本地：模型和推理都在内网，数据不出门，成本最高。","混合：敏感数据本地处理，通用能力调外部 API。","托管专区：云厂商的专属实例，兼顾隔离与运维便利。"],sum:"先划数据边界，再选部署形态。"},

{t:"推理服务怎么扛并发",lv:"高级",min:6,pts:["关键指标：吞吐（每秒多少 token）与延迟（首 token 多久）。","批处理（continuous batching）能显著提升吞吐，但会拉高单请求延迟。","排队、限流、超时三件套必须配齐，否则一个慢请求拖垮全站。"],sum:"吞吐与延迟是跷跷板，要按业务定权重。"},

{t:"vLLM 与 Ollama 的定位",lv:"高级",min:5,pts:["Ollama 面向个人与快速验证：一条命令跑起来，够用就好。","vLLM 面向服务化：高吞吐、多并发、PagedAttention 省显存。","先 Ollama 验证效果，稳定后再上 vLLM 做服务。"],sum:"验证用 Ollama，生产用 vLLM。"},

{t:"GPU 显存怎么估算",lv:"高级",min:6,pts:["粗略公式：参数量 × 每参数字节（FP16 约 2 字节）+ 激活与 KV Cache + 框架开销。","7B 模型 FP16 约 14GB 权重，加上上下文缓存，24GB 卡比较稳妥。","量化到 4bit 可把权重大幅压下来，但上下文缓存不会等比例减少。"],sum:"先算权重，再算 KV Cache，最后留 20% 余量。"},

{t:"模型网关：统一入口与限流",lv:"高级",min:6,pts:["所有调用走网关：统一鉴权、计费、限流、日志、降级。","可按团队/应用分配配额，防止某个脚本把额度刷爆。","网关还能做模型路由与灰度，切供应商不用改业务代码。"],sum:"网关是 AI 能力的「配电箱」。"},

{t:"API Key 管理与轮换",lv:"高级",min:5,pts:["密钥只放服务端或密钥管理服务，绝不进前端和代码仓库。","按应用分配独立 key，便于计费与封禁；定期轮换。","泄露处置：立即吊销、查用量、看是否已有异常调用。"],sum:"一应用一 key，可吊销可轮换。"},

{t:"私有知识库的权限设计",lv:"高级",min:6,pts:["检索前先按用户权限过滤文档，不能「先检索再裁剪」。","文档要打上部门/密级标签，向量库里存元数据。","越权检索是 RAG 最常见的漏洞。"],sum:"权限过滤要在检索之前，不是之后。"},

{t:"日志脱敏与合规",lv:"高级",min:5,pts:["手机号、身份证、地址、密钥等要在入库前脱敏或哈希。","提示词与输出都可能含个人信息，别默认可以长期保存。","留存期限、访问审计、删除机制都要有明文规定。"],sum:"AI 日志也是用户数据，按数据治理来管。"},

{t:"成本核算：一次问答多少钱",lv:"高级",min:6,pts:["成本 = 输入 token × 单价 + 输出 token × 单价 + 检索/存储/带宽。","典型 RAG 问答的输入远大于输出，长上下文是主要成本来源。","按业务线分摊成本，才能判断这个功能值不值得做。"],sum:"算清单次成本，再决定铺多广。"},

{t:"线上事故复盘：AI 功能常见翻车姿势",lv:"高级",min:6,pts:["四类高发：输出错误被直接执行、越权取数、成本失控、供应商限流。","复盘要落到机制：二次确认、权限校验、配额、降级预案。","「模型偶尔胡说」不是解释，而是必须被兜住的风险。"],sum:"把「可能错」当成设计前提。"},

{t:"版本回滚与模型切换",lv:"高级",min:5,pts:["模型、提示词、检索配置都要版本化，能一键回到上一版。","切换前用固定评测集跑对比，确认不是「感觉更好」。","保留旧接入通道至少一个周期，防供应商突发故障。"],sum:"可回滚，才敢上线。"},

{t:"提示词版本管理",lv:"高级",min:5,pts:["提示词是代码：进仓库、写变更说明、做评审。","每次改动记录「为什么改」和评测分数变化。","团队共享提示词库，避免各自重复踩坑。"],sum:"提示词要像代码一样被管理。"},

{t:"灰度与影子流量",lv:"高级",min:5,pts:["影子流量：新版本只记录不展示，用真实请求做对比评估。","灰度：小比例真实用户先用，观察指标再扩量。","两者结合，能在不影响用户的前提下验证效果。"],sum:"先用影子验证，再灰度放量。"},

{t:"监控指标：从可用到好用",lv:"高级",min:5,pts:["可用：成功率、P99 延迟、错误码分布。","好用：采纳率、追问率、人工修改比例、投诉量。","只盯可用会漏掉「没报错但答得烂」这类问题。"],sum:"可用看技术指标，好用看业务指标。"},

{t:"AI 在运维岗的六个真实用法",lv:"高级",min:6,pts:["日志聚类与异常摘要、告警降噪与根因假设、脚本与命令生成、配置与文档校对、巡检报告初稿、值班问答助手。","共同点：AI 出初稿，人做确认，责任仍在人。","最适合的是「重复且容错」的环节，不是不可逆操作。"],sum:"AI 做第一稿，人做最后一道闸。"},

{t:"用 AI 写 Shell 脚本的边界",lv:"高级",min:6,pts:["可以让它生成框架、参数解析、日志格式、常见命令组合。","必须自己审：rm 路径、变量为空、并发、set -euo pipefail、转义与引号。","在生产执行前先在测试环境干跑，加 dry-run 开关。"],sum:"脚本可以让 AI 起草，危险动作必须人审。"},

{t:"用 AI 分析日志与告警摘要",lv:"高级",min:5,pts:["把时间窗内的错误按模式聚类，输出「发生了什么、影响面、可能原因」。","喂之前先脱敏，并限制输入长度，只给关键片段。","结论要能追溯到原始日志行号，别只要一段漂亮话。"],sum:"摘要要可追溯，不能只有结论。"},

{t:"用 AI 做巡检与值班助手",lv:"高级",min:5,pts:["巡检：把采集到的指标与阈值交给模型写成日报，人复核异常项。","值班助手：接入知识库，回答「这个告警上次怎么处理的」。","不要让 AI 直接执行变更，只让它建议和检索。"],sum:"AI 建议，人执行。"},

{t:"用 AI 生成 SQL 与正则",lv:"高级",min:5,pts:["给清楚表结构、字段含义、示例数据，生成质量会明显提升。","正则要在小样本上先跑，注意贪婪匹配与转义。","生成的 SQL 先 EXPLAIN，确认没有全表扫描和误删风险。"],sum:"先小样本验证，再上生产。"},

{t:"AI 辅助排障的正确姿势",lv:"高级",min:6,pts:["先给现象和时间线，再给相关日志与变更记录，让它提出假设。","把假设当线索去验证，不要当结论执行。","让它列出「下一步该查什么」，比让它直接给答案更有用。"],sum:"用 AI 找线索，不用 AI 下判决。"},

{t:"让 AI 写文档与变更说明",lv:"高级",min:4,pts:["给它变更内容、影响范围、回滚方案，让它整理成结构化文档。","术语和事实要自己校正，模型容易「补全」不存在的细节。","模板固定后，输出一致性会大幅提高。"],sum:"文档可外包给 AI，事实校对不能。"},

{t:"AI 代码审查能信几分",lv:"高级",min:5,pts:["擅长：明显的空指针、资源未释放、边界条件、拼写与命名。","不擅长：业务语义、架构权衡、性能瓶颈的真实分布。","把 AI 审查当第一道筛子，人审聚焦设计与风险。"],sum:"AI 抓低级错误，人抓方向性错误。"},

{t:"数据合规：个人信息与出境",lv:"高级",min:6,pts:["把个人信息发给外部模型前，先判断是否属于敏感信息、是否需要授权。","跨境调用涉及数据出境要求，敏感场景优先私有化。","合同、协议里的数据处理条款要看清。"],sum:"不清楚能不能发，就不要发。"},

{t:"团队协作：把提示词资产化",lv:"高级",min:4,pts:["把有效的提示词、评测集、失败案例存成团队资产。","新人上手直接复用，不用从零试。","定期清理过时提示词，避免误用。"],sum:"经验要沉淀，不要留在个人聊天窗口里。"},

{t:"需求拆解：一个 AI 功能怎么立项",lv:"高级",min:6,pts:["先定义问题与成功指标，再谈用什么模型。","拆成最小闭环：能跑通「输入→处理→输出→反馈」的最小版本。","预估成本与风险，明确不做什么。"],sum:"先想清楚要解决什么，再选模型。"},

{t:"验收标准：怎么判断做完了",lv:"高级",min:5,pts:["功能验收：评测集通过率、延迟、成本三条线都要达标。","体验验收：错误可解释、可重试、有人工兜底。","运维验收：日志、监控、告警、回滚都就位。"],sum:"三条线都过，才算上线。"},

{t:"三个真实翻车场景",lv:"高级",min:6,pts:["场景一：客服 AI 误读政策并承诺赔付，引发投诉——缺二次确认与知识边界。","场景二：Agent 被文档里的指令诱导，把内网数据发到外部——缺注入防护与出域管控。","场景三：上线首日调用量翻十倍，账单爆炸——缺配额与限流。"],sum:"翻车多半不在模型，在工程兜底。"},

{t:"三年后的 AI 技能地图",lv:"高级",min:5,pts:["基础层：数据、模型评估、提示工程。","工程层：检索、Agent、部署与成本控制。","业务层：把 AI 嵌进流程，衡量真实收益。"],sum:"会用模型的人很多，能把 AI 跑稳的人稀缺。"},

{t:"每日学习方法：把知识变成能力",lv:"高级",min:4,pts:["每天一节概念 + 一个真实场景练习，比一次看十节有效。","学完立刻在自己工作里找一个可用的点，哪怕很小。","每周复盘一次：这周哪个用法真的省了时间。"],sum:"学一点，用一次，留一条记录。"}
);
/* ===== 三个月学习量扩展：健身 16-90 ===== */
FIT_LESSONS.push(
{t:"热身怎么做才有效",lv:"初级",min:5,pts:["热身=升温 + 激活 + 动作预演，5-10 分钟足够。","先做 3-5 分钟低强度有氧，再做目标肌群的轻重量组。","静态拉伸放在训练后，训练前做动态活动更合适。"],sum:"热身是把身体叫醒，不是把力气用掉。",q:{q:"训练前的拉伸更推荐？",o:["静态拉伸","动态活动","完全不做"],a:1}},

{t:"拉伸：什么时候做、做多久",lv:"初级",min:4,pts:["训练后做静态拉伸，每个部位 20-30 秒，2 组。","拉伸改善的是活动度与舒适感，不是「排乳酸」。","疼到龇牙的拉伸没有额外收益，反而不利于恢复。"],sum:"拉伸求舒适的活动度，不求疼痛。"},

{t:"呼吸与核心收紧：被忽略的基础",lv:"初级",min:5,pts:["大重量时用「吸气收紧、发力时短促呼气」，保持腹压稳定脊柱。","核心不是吸肚子，而是像准备挨一拳那样绷住。","憋气时间别过长，组间正常呼吸。"],sum:"腹压稳住，力量才传得出去。",q:{q:"大重量动作时核心应该？",o:["完全放松","绷紧维持腹压","用力吸气鼓肚"],a:1}},

{t:"五个基本动作模式",lv:"初级",min:5,pts:["蹲（Squat）、髋铰链（Hinge）、推（Push）、拉（Pull）、负重行走（Carry）。","所有训练动作都是这几类的变式，先练模式再上重量。","每周每个模式至少练一次，身体才均衡。"],sum:"动作千变万化，模式只有五个。"},

{t:"器械还是自由重量",lv:"初级",min:5,pts:["器械稳定、好上手、适合孤立肌肉和康复初期。","自由重量需要更多稳定肌参与，功能性更强，但技术要求高。","新手建议：先用器械建立感觉，再过渡到杠铃/哑铃复合动作。"],sum:"先用器械学会发力，再用自由重量练能力。"},

{t:"训练日志：没有记录就没有进步",lv:"初级",min:4,pts:["记录动作、重量、组数、次数、RPE，三秒完成。","下次训练看上次的记录，才知道该加多少。","连续两周没进步，翻日志就能找到原因。"],sum:"写下来，才有可比较的进步。"},

{t:"碳水与脂肪：不是敌人",lv:"初级",min:5,pts:["碳水是训练的主要燃料，长期过低会掉力量、掉情绪。","脂肪参与激素合成，过低会影响恢复与内分泌。","优先保证蛋白质，再把剩余热量分给碳水和脂肪。"],sum:"三大营养素各有用，别一刀切。"},

{t:"喝水与电解质",lv:"初级",min:4,pts:["训练中每 15-20 分钟补水 150-250ml，出汗多时补电解质。","脱水 2% 就能明显掉力量和专注度。","尿液浅黄色是比较直观的参考。"],sum:"脱水先掉的是表现。"},

{t:"步数：最被低估的训练量",lv:"初级",min:4,pts:["每天 8000-10000 步对代谢和心肺都有帮助，且几乎不影响恢复。","久坐人群把步数补起来，比多做一组卷腹有用。","目标拆成三段走，比一次走完更容易坚持。"],sum:"先把步数走够，再谈进阶训练。"},

{t:"睡眠：真正的增肌时段",lv:"初级",min:5,pts:["深睡阶段生长激素分泌最多，肌肉修复主要发生在睡眠中。","7-9 小时是多数人的合理区间，少于 6 小时训练效果明显打折。","固定入睡时间比睡够时长更难做到，但收益更大。"],sum:"睡不好，练和吃都白费一半。"},

{t:"训练时长：45-70 分钟就够",lv:"初级",min:4,pts:["超过 90 分钟的训练，后半段质量大幅下降。","把时间花在复合动作上，孤立动作放最后。","组间休息别刷手机，容易拖成两小时。"],sum:"练得久不等于练得好。"},

{t:"组间休息多长合适",lv:"初级",min:5,pts:["大重量复合动作 2-3 分钟，孤立动作 60-90 秒。","休息太短会掉下一组的力量，太长会掉训练密度。","按目标调：力量优先长休息，减脂可缩短。"],sum:"休息时长由目标决定。",q:{q:"大重量深蹲组间休息建议？",o:["30 秒","2-3 分钟","5 分钟以上"],a:1}},

{t:"要不要练到力竭",lv:"初级",min:5,pts:["多数训练保留 1-3 次余力（RIR 1-3）就够了。","频繁力竭会显著增加恢复负担，影响下次训练。","只有孤立动作和最后几组可以偶尔力竭。"],sum:"留一点余力，换来更稳的长期进步。"},

{t:"关节活动度：动作幅度的前提",lv:"初级",min:4,pts:["深蹲蹲不下去、卧推肩痛，多半是活动度不够。","训练前做针对性活动（踝、髋、胸椎、肩）。","活动度不足时降低幅度，而不是硬扛重量。"],sum:"幅度不够，先补活动度。"},

{t:"上肢/下肢分化怎么排",lv:"中级",min:5,pts:["上/下分化：两天一循环，适合每周 4 天。","推/拉/腿：三天一循环，适合每周 3-6 天。","同一肌群两次训练间隔 48 小时以上更利于恢复。"],sum:"分化是为了让每个部位都有足够频率和恢复。"},

{t:"复合动作优先原则",lv:"中级",min:5,pts:["每次训练先做最重的复合动作，趁精力最好。","复合动作带来的整体刺激远大于孤立动作。","孤立动作放在最后，作为补充和塑形。"],sum:"先练大的，再练小的。"},

{t:"增肌饮食：热量盈余怎么定",lv:"中级",min:5,pts:["每天多吃 200-300 千卡即可，盈余太大只增脂。","蛋白质 1.6-2.2g/kg 体重，分 3-4 餐摄入。","增肌期体脂上升过快，就调回维持热量。"],sum:"小幅盈余，缓慢增肌。"},

{t:"减脂饮食：缺口怎么定",lv:"中级",min:5,pts:["每天缺口 300-500 千卡，每周掉 0.5-1% 体重比较稳。","缺口太大，掉的是肌肉和力量。","减脂期蛋白质要更高，保护肌肉。"],sum:"慢一点掉，才留得住肌肉。"},

{t:"蛋白质怎么分配",lv:"中级",min:5,pts:["每餐 20-40g，比一次性吃完更利于合成。","训练后 1-2 小时内补充，但不是必须精确到分钟。","植物蛋白要搭配多种来源，补足必需氨基酸。"],sum:"总量优先，分配次之。"},

{t:"补剂：只留下真正有用的",lv:"中级",min:5,pts:["有明确证据的：肌酸（3-5g/天）、蛋白粉（方便补量）、咖啡因（训练前）。","证据弱的：大多数「燃脂」「促睾」类产品。","补剂是补充，不是替代饮食。"],sum:"先吃好饭，再谈补剂。"},

{t:"Zone 2：低强度有氧的价值",lv:"中级",min:5,pts:["Zone 2 是能说话但略喘的强度，心率约最大心率 60-70%。","每周 150 分钟以上，能显著提升心肺基础和恢复能力。","不占用太多恢复资源，适合与力量训练并行。"],sum:"慢，但打得牢。"},

{t:"HIIT：高效但别过量",lv:"中级",min:5,pts:["20-30 秒全力 + 60-90 秒恢复，重复 6-10 轮。","每周 1-2 次足够，多了会严重影响力量训练恢复。","体重较大或关节不适，优先低冲击形式（划船、单车）。"],sum:"HIIT 是调味料，不是主食。"},

{t:"核心抗旋转训练",lv:"中级",min:4,pts:["平板支撑、死虫、农夫行走、单臂负重行走都属抗旋转/抗伸展。","卷腹练的是屈曲，日常更需要的其实是稳定。","每周 2-3 次，每次 2-3 个动作就够。"],sum:"核心的价值在「稳住」，不在「卷起来」。"},

{t:"单侧训练：补平左右差",lv:"中级",min:4,pts:["单腿硬拉、保加利亚分腿蹲、单臂推举能暴露并改善左右不平衡。","单侧训练对稳定性和核心要求更高。","两侧差距超过 10% 时，先练弱侧。"],sum:"先练弱的那一边。"},

{t:"肩部健康：别只练推",lv:"中级",min:5,pts:["推与拉的比例建议 1:2，多做划船、面拉、外旋。","肩痛常见原因是胸肌紧、后束弱、肩胛控制差。","卧推时肩胛后收下沉，别让肩头前顶。"],sum:"肩要稳，先补后侧。"},

{t:"膝健康：深蹲不等于伤膝",lv:"中级",min:5,pts:["正确深蹲对膝关节是保护而非损伤，前提是控制与渐进。","膝内扣、脚跟离地、蹲太深超出活动度，才是风险点。","已有不适时，可先用箱式深蹲控制幅度。"],sum:"伤膝的不是动作，是错误的负荷与幅度。"},

{t:"腰背保护：髋铰链是关键",lv:"中级",min:5,pts:["硬拉、罗马尼亚硬拉练的是髋铰链，脊柱要保持中立。","腰痛多来自弯腰搬重物时的屈曲 + 旋转。","日常搬东西：屈髋屈膝、物体贴近身体。"],sum:"学会用髋，腰就少受罪。"},

{t:"圆肩驼背怎么练",lv:"中级",min:5,pts:["拉伸胸小肌与胸大肌，强化中下斜方、菱形肌、后束。","面拉、Y 字举、俯身划船是核心动作。","日常姿势比训练更关键：屏幕抬高、少低头。"],sum:"前面松一松，后面练一练。"},

{t:"骨盆前倾怎么调",lv:"中级",min:5,pts:["强化臀肌与腹深层，放松髂腰肌与竖脊肌。","臀桥、死虫、髋屈肌拉伸是入门组合。","别追求「收腹站直」，而是找到中立位。"],sum:"前侧松、后侧强，骨盆才回正。"},

{t:"体重管理：先定目标再选方法",lv:"中级",min:5,pts:["先测体脂与腰围，别只看体重。","目标拆成 4 周一个阶段，每阶段只调整一个变量。","体重波动受水分影响，看周均值更可靠。"],sum:"看趋势，不看单日数字。"},

{t:"体脂怎么测更靠谱",lv:"中级",min:4,pts:["家用体脂秤误差大，但看长期趋势可用。","腰围 + 体脂秤 + 照片三项结合，判断更准。","同一时间、同一条件下测，才有可比性。"],sum:"同条件、看趋势。"},

{t:"出差与居家怎么练",lv:"中级",min:5,pts:["自重方案：深蹲、俯卧撑、臀桥、平板、弓步，各 3 组。","弹力带是最便携的负重工具。","酒店训练控制在 20-30 分钟，重点是不断档。"],sum:"没器械也要动，断档最伤进步。"},

{t:"八周计划怎么排",lv:"高级",min:6,pts:["前 4 周建立动作与容量，后 4 周加负荷、减次数。","每周记录总量（组数×次数×重量），每 2 周加 5-10%。","第 8 周做减载周，让身体吸收成果。"],sum:"先建立，再加码，末尾减载。"},

{t:"增肌执行：把细节做对",lv:"高级",min:6,pts:["每个肌群每周 10-20 组有效容量，分 2 次练。","动作幅度完整、离心控制 2 秒，比加重量更有效。","连续 4 周力量不动，先检查睡眠与热量。"],sum:"容量、幅度、恢复，三件事。",q:{q:"增肌最该优先增加的是？",o:["重量","有效容量与幅度","训练天数"],a:1}},

{t:"减脂执行：别把力量丢了",lv:"高级",min:6,pts:["减脂期力量训练保持重量，减少组数而不是降重量。","每周 2-3 次力量 + 足够步数，比纯有氧更保肌肉。","掉力量明显时，把热量缺口收小一点。"],sum:"减脂靠缺口，保肌靠力量。"},

{t:"外卖与聚餐怎么吃",lv:"高级",min:5,pts:["优先选高蛋白 + 少油：鸡胸、牛肉、鱼、豆腐，配蔬菜。","主食减半而不是不吃，避免晚上暴食。","聚餐当天把另外两餐做清淡，别用「明天再减」拖延。"],sum:"一顿吃不胖，长期才决定结果。"},

{t:"酒对训练的影响",lv:"高级",min:4,pts:["酒精抑制蛋白合成、影响睡眠质量与恢复。","训练后 24 小时内尽量避免。","应酬难免时，控制量并多补水。"],sum:"酒是恢复的减法。"},

{t:"睡眠优化：比补剂更重要",lv:"高级",min:5,pts:["固定起床时间，比固定入睡更容易执行。","睡前一小时减少强光与刷手机，室温略低更好。","午睡 20 分钟内，不影响夜间睡眠。"],sum:"先把作息固定，再谈其他。"},

{t:"压力与恢复",lv:"高级",min:5,pts:["工作压力大时，训练量要主动下调，而不是硬顶。","心率变异性、静息心率、睡眠时长可以作为恢复参考。","连续两周疲劳累积，安排一个减载周。"],sum:"压力也是训练负荷的一部分。"},

{t:"小伤痛怎么处理",lv:"高级",min:5,pts:["急性期遵循保护、适度负荷、冰敷、加压、抬高。","不要完全停练，改成无痛范围内的活动更利于恢复。","疼痛持续超过两周或夜间痛，尽快就医。"],sum:"别硬扛，也别彻底躺平。"},

{t:"跑步入门：从走到跑",lv:"高级",min:5,pts:["走跑交替：跑 1 分钟走 2 分钟，重复 20-30 分钟。","每周增加跑的比例，不超过总量 10%。","选缓震好的鞋，落地在身体正下方。"],sum:"慢起步，才跑得久。"},

{t:"5K 八周计划",lv:"高级",min:6,pts:["每周 3 次：一次间歇、一次轻松跑、一次长距离。","轻松跑心率控制在能对话的程度。","第八周减量，比赛前两天只做散步和拉伸。"],sum:"三练一休，赛前减量。"},

{t:"深蹲技术细节",lv:"高级",min:6,pts:["脚掌三点着地、膝盖顺脚尖方向、躯干保持刚性。","杠位高低决定发力侧重：高杠偏股四，低杠偏后链。","起身时先顶髋再用腿蹬，避免臀部先起。"],sum:"稳、正、同步，比深度更重要。"},

{t:"硬拉技术细节",lv:"高级",min:6,pts:["杠贴小腿，肩胛在杠正上方，背部中立。","起杠用腿推地，杠贴身走，别绕膝。","锁髋不后仰，下放控制到位。"],sum:"贴、稳、推地。"},

{t:"卧推技术细节",lv:"高级",min:6,pts:["肩胛后收下沉，脚踩实，形成稳定桥。","杠落点在乳线附近，前臂垂直地面。","大重量务必有人保护或用安全架。"],sum:"稳肩、踩地、控制落点。"},

{t:"辅助动作怎么选",lv:"高级",min:5,pts:["按弱环选：起杠难练暂停硬拉，锁定难练臀桥与背伸。","每个部位保留 2-3 个辅助动作即可，别堆太多。","辅助动作放在主项之后。"],sum:"缺什么补什么，别乱堆。"},

{t:"体测与记录怎么做",lv:"高级",min:4,pts:["每 4 周测：体重、腰围、主要动作 5RM、静息心率。","照片固定角度、光线、时间。","数据用于调整计划，不是用来自责。"],sum:"用数据判断，不靠感觉。"},

{t:"习惯养成：让训练不需要意志力",lv:"高级",min:4,pts:["固定时间、固定地点、固定前三个动作，降低启动成本。","最低标准日：哪怕只做 15 分钟也算完成。","连续中断三天以上，用最低标准重启。"],sum:"降低门槛，比提高意志更有效。"},

{t:"年度复盘：这一年的训练",lv:"高级",min:4,pts:["看三个数字：训练次数、主要动作进步、体脂变化。","找出中断的原因，比找借口有用。","下一年只定 2 个目标，别贪多。"],sum:"复盘是为了下一年更省力。"},

{t:"局部减脂是伪命题",lv:"高级",min:4,pts:["脂肪消耗是全身性的，练腹不等于减肚子。","腹肌可见靠体脂率，不靠卷腹数量。","减脂顺序由基因决定，无法指定部位。"],sum:"练哪里不等于瘦哪里。"},

{t:"怎么辨别健身伪科学",lv:"高级",min:5,pts:["警惕：单一研究结论、夸张对比图、卖产品的「专家」。","看是否有对照组、样本量、可重复性。","先问「他的收益是什么」。"],sum:"证据强度比口才重要。"},

{t:"久坐办公的 10 分钟方案",lv:"高级",min:4,pts:["每 90 分钟起身 3 分钟：髋屈肌拉伸、胸椎旋转、靠墙天使。","工位调整：屏幕与视线齐平，手肘 90 度。","每天累计 20 分钟的活动，比一次猛练更有用。"],sum:"碎片活动，抵消久坐伤害。"},

{t:"新手三个月路线图",lv:"高级",min:6,pts:["第 1 月：学动作模式，每周 3 次全身训练，重量轻、次数多。","第 2 月：加入渐进超负荷，固定 4-5 个主项。","第 3 月：提高强度，开始记录 5RM 并调整饮食。"],sum:"先学对，再练重，最后精细化。"},

{t:"训练前中后的时间安排",lv:"初级",min:4,pts:["训练前 1-2 小时吃点碳水 + 蛋白，避免空腹大重量。","训练中超过 60 分钟可补少量快碳。","训练后正常吃一餐即可，不必卡 30 分钟窗口。"],sum:"整体饮食比窗口更重要。"},

{t:"体重不变但变好看：重组",lv:"中级",min:4,pts:["新手、复训者、体脂偏高者容易同时增肌减脂。","看围度与照片，别只盯体重。","蛋白质足够 + 力量训练是重组的前提。"],sum:"体重是假指标，围度更真实。"},

{t:"有氧会不会掉肌肉",lv:"中级",min:4,pts:["适量有氧不会明显影响增肌，反而提升恢复能力。","同一时段做大量有氧 + 力量，才会互相干扰。","力量与有氧间隔 6 小时以上更理想。"],sum:"适量有氧是帮手，过量才是对手。"},

{t:"心率区间怎么算",lv:"中级",min:4,pts:["最大心率粗略估算 220-年龄，个体差异较大。","Zone2 约 60-70%，乳酸阈约 80-90%。","用「能说话程度」判断更实用。"],sum:"公式只是起点，体感更可靠。"},

{t:"训练计划模板：全身三天",lv:"中级",min:5,pts:["每次：一个蹲类、一个髋铰链、一个推、一个拉、一个核心。","3 组 × 8-12 次，RIR 2-3。","适合新手与时间有限的人。"],sum:"五天太忙，三天全身最实用。"},

{t:"平台期怎么破",lv:"中级",min:5,pts:["先排查睡眠、热量、训练记录三项，再看计划。","换变量：加容量、改次数区间、换动作变式。","每 8-12 周安排一次减载周。"],sum:"先查恢复，再改计划。"},

{t:"女性训练与生理周期",lv:"中级",min:4,pts:["力量训练不会让女性变「壮」，激素水平决定上限。","经期前后力量与状态波动正常，可下调强度。","孕期与产后训练需专业指导。"],sum:"该练就练，按状态调节。"},

{t:"中老年训练要点",lv:"中级",min:4,pts:["优先维持肌肉量与骨密度，力量训练不可省。","加入平衡与本体感觉训练，降低跌倒风险。","恢复时间更长，频率可降低、强度渐进。"],sum:"越年长，越要练力量。"},

{t:"居家器械怎么配",lv:"中级",min:4,pts:["优先级：可调哑铃 > 弹力带 > 单杠 > 壶铃。","一张瑜伽垫 + 一条弹力带就能覆盖大部分动作。","先买能坚持用的，别一次买全套。"],sum:"买会用到的，不买好看的。"},

{t:"拍照记录：最直观的反馈",lv:"中级",min:3,pts:["固定位置、光线、时间、姿势，每月一次。","对比 8 周以上的变化才有意义。","照片比体重更能反映体成分变化。"],sum:"同条件对比，才看得出变化。"},

{t:"训练搭子与社群",lv:"中级",min:3,pts:["有人一起练，出勤率明显更高。","互相记录与提醒，比互相攀比有用。","找不到搭子，就用打卡记录替代。"],sum:"外部约束能省很多意志力。"},

{t:"恢复日该做什么",lv:"中级",min:4,pts:["散步、轻度活动、拉伸、泡沫轴，20-30 分钟。","完全躺平反而不如轻度活动恢复快。","恢复日不安排大重量与高强度间歇。"],sum:"恢复日要动，但别累。"},

{t:"减脂平台期",lv:"中级",min:4,pts:["体重两周不动，先看周均值与围度，不要慌。","调整顺序：先加步数，再减热量，最后加训练量。","每 8-12 周安排一周维持热量，重置代谢压力。"],sum:"先加消耗，再减摄入。"},

{t:"训练强度与容量的平衡",lv:"高级",min:5,pts:["强度（重量）与容量（组数×次数）不能同时猛加。","增强度时降容量，增容量时降强度。","每周总量增幅控制在 10% 以内。"],sum:"一张一弛，别两头顶满。"},

{t:"动作选择的三个层次",lv:"高级",min:4,pts:["主项：2-4 个决定力量水平的复合动作。","辅助：改善弱环的变式。","补充：孤立与健康维护类动作。"],sum:"主项少而重，辅助准而精。"},

{t:"疼痛与训练：红旗信号",lv:"高级",min:5,pts:["需要就医的信号：夜间痛、肿胀、关节卡锁、麻木放射。","肌肉酸痛（延迟性）与关节刺痛要区分。","带痛训练的原则：无痛范围、降负荷、缩短幅度。"],sum:"分清酸痛与损伤。"},

{t:"如何给自己写计划",lv:"高级",min:6,pts:["先定目标（力量/增肌/减脂），再定频率与容量。","每周固定主项，其余按恢复情况浮动。","每 4 周复盘一次，只改一个变量。"],sum:"目标 → 频率 → 容量 → 复盘。"},

{t:"长期健康指标要盯哪些",lv:"高级",min:5,pts:["静息心率、腰围、血压、血脂、空腹血糖。","力量水平与步数是最容易自己监测的两项。","每年一次体检，把训练数据一起带上。"],sum:"练得久，也要查得勤。"},

{t:"三个月后怎么继续",lv:"高级",min:4,pts:["把三个月的记录整理成基线数据。","下一阶段只提高一个目标（比如深蹲 +20kg）。","保持习惯优先于追求极限。"],sum:"稳着往前走，别急着换计划。"}
);
/* ===== 三个月学习量扩展：金融 16-90 ===== */
FIN_LESSONS.push(
{t:"记账：所有理财的起点",lv:"初级",min:5,pts:["只记三件事：收入、固定支出、可自由支配支出。","记三个月就能看出钱漏在哪，多数人漏在外卖、订阅、冲动购买。","工具不重要，坚持记才重要。"],sum:"先看清现金流，再谈规划。",q:{q:"记账最该关注的分类是？",o:["每一笔都精确到分","固定支出与自由支出","只记大额"],a:1}},

{t:"预算：给钱分配去向",lv:"初级",min:5,pts:["推荐 50/30/20：必需 50%、想要 30%、储蓄投资 20%。","预算不是限制消费，而是让储蓄先发生。","按月上调不如下调支出项来得有效。"],sum:"先存后花，而不是花完再存。"},

{t:"收入、支出、结余的关系",lv:"初级",min:4,pts:["结余 = 收入 - 支出，是你能拿来投资和还债的全部弹药。","提高结余的两条路：涨收入、降支出，前者上限更高。","结余率 30% 以上，财务弹性明显更好。"],sum:"结余率是理财能力最直接的指标。"},

{t:"单利与复利怎么算",lv:"初级",min:5,pts:["单利：利息不参与生息；复利：利息继续生息。","例：10 万、年 5%，单利 10 年 15 万，复利约 16.3 万。","复利效应需要时间，越早开始差距越大。"],sum:"复利靠时间，时间靠早点开始。",q:{q:"复利与单利的关键区别？",o:["利率更高","利息也会继续生息","期限更长"],a:1}},

{t:"72 法则：多久翻倍",lv:"初级",min:4,pts:["72 ÷ 年化收益率 ≈ 翻倍所需年数。","年化 6% 约 12 年翻倍，年化 12% 约 6 年。","用它快速判断一个收益率是否值得长期等待。"],sum:"72 除以收益率，就是翻倍年数。"},

{t:"股票、债券、商品、现金",lv:"初级",min:5,pts:["股票：企业所有权，长期收益高、波动大。","债券：借钱给机构，收益稳定、受利率影响。","商品抗通胀但不产生现金流；现金安全但被通胀侵蚀。"],sum:"四类资产，各有各的脾气。"},

{t:"基金是什么：一篮子资产",lv:"初级",min:4,pts:["基金把很多人的钱合在一起，由管理人按规则投资。","按标的分为股票型、债券型、混合型、货币型。","你买的是「一篮子」，不是单个公司。"],sum:"基金=打包好的资产组合。"},

{t:"ETF 与场内外基金",lv:"初级",min:5,pts:["ETF 在交易所买卖，像股票一样随时成交，费率通常更低。","场外基金按净值申赎，T+1 确认，适合定投。","同一指数的 ETF 与场外基金，长期收益差别主要在费率。"],sum:"同指数选费率低的。"},

{t:"主动与被动：谁更靠谱",lv:"初级",min:5,pts:["被动（指数）复制市场，费率低、可预期。","主动靠基金经理选股，长期能持续跑赢的只是少数。","新手优先被动，把精力放在资产配置上。"],sum:"先拿住市场平均，再谈超越。"},

{t:"管理费与交易成本",lv:"初级",min:5,pts:["管理费每年从净值扣，1.5% 与 0.15% 的差距 20 年非常可观。","申购赎回费、佣金、印花税都要算进成本。","频繁交易的成本，往往比选错标的更伤收益。"],sum:"省下的费率，就是确定的收益。"},

{t:"定投：把择时交给时间",lv:"初级",min:5,pts:["固定时间、固定金额买入，摊平成本、降低情绪干扰。","适合波动大、长期向上的资产，不适合单边下跌的标的。","定投的关键是「不停」，不是「抄底」。"],sum:"定投治的是手痒，不是治下跌。"},

{t:"分散：唯一免费的风险控制",lv:"初级",min:5,pts:["分散在不同资产、行业、地区，降低单一风险。","分散不是买很多只同类基金，那只是「伪分散」。","3-5 类低相关资产，效果就很明显。"],sum:"相关性越低，分散越有效。"},

{t:"波动与最大回撤",lv:"初级",min:5,pts:["波动是日常起伏，最大回撤是从高点跌到低点的幅度。","回撤 50% 需要涨 100% 才能回本。","能承受多大回撤，决定你该配多少股票。"],sum:"先想清楚能亏多少，再决定买多少。",q:{q:"组合从高点跌 50%，需要涨多少回本？",o:["50%","100%","75%"],a:1}},

{t:"财报三张表入门",lv:"初级",min:5,pts:["利润表看赚不赚钱，资产负债表看家底，现金流量表看钱是否真到账。","利润可以做账，现金流更难造假。","看财报先看现金流是否长期为正。"],sum:"利润是观点，现金是事实。"},

{t:"PE 与 PB：贵不贵的第一眼",lv:"初级",min:5,pts:["PE=股价/每股盈利，反映市场愿为每元利润付多少钱。","PB=股价/每股净资产，常用于金融、周期行业。","低 PE 可能是便宜，也可能是盈利要下滑。"],sum:"估值是相对概念，要跟同行与历史比。"},

{t:"股息与分红",lv:"初级",min:4,pts:["股息率=每股分红/股价，反映现金回报。","分红除权后股价会下调，不是白拿钱。","高股息策略适合追求现金流的人，不适合追成长的人。"],sum:"分红是把利润分给你，不是额外奖励。"},

{t:"资产配置：先定比例再选产品",lv:"中级",min:6,pts:["先确定股/债/商品/现金的比例，再在里面挑具体产品。","比例由你的目标、期限、风险承受力决定。","配置错了，选再好的产品也救不回来。"],sum:"配置决定结果，产品决定细节。"},

{t:"再平衡：什么时候调仓",lv:"中级",min:5,pts:["偏离目标比例超过 5 个百分点，或每半年/一年调一次。","再平衡是「高卖低买」的纪律化版本。","频繁再平衡会增加成本，过度不调会变形。"],sum:"用规则调仓，不用情绪调仓。"},

{t:"相关系数：分散的科学依据",lv:"中级",min:4,pts:["相关系数 1 表示同涨同跌，-1 表示完全反向。","组合里加入低相关资产，整体波动会下降。","股债常呈负相关或低相关，是经典搭配。"],sum:"找低相关的资产，才是真分散。"},

{t:"汇率怎么影响你的钱",lv:"中级",min:5,pts:["本币贬值，持有外币资产折算回来更值钱，进口商品更贵。","境外资产要对冲汇率，也可以不对冲。","长期看，分散到不同货币能降低单一货币风险。"],sum:"持有外币资产，等于买了半个汇率保险。"},

{t:"QDII 与境外投资",lv:"中级",min:4,pts:["QDII 基金让你用人民币买境外资产，注意费率和额度限制。","境外资产能分散地区风险，但也带来汇率与政策风险。","先配好境内，再考虑境外，别本末倒置。"],sum:"境外配置是补充，不是主菜。"},

{t:"黄金：抗通胀还是避险",lv:"中级",min:4,pts:["黄金不产生现金流，长期收益低于股票，但在危机时表现较好。","适合做小比例配置（5-10%），不适合当主力资产。","实物金饰溢价高，投资优先选金条或黄金 ETF。"],sum:"黄金是保险，不是发动机。"},

{t:"原油与大宗商品",lv:"中级",min:4,pts:["商品价格受供需、地缘、库存周期影响，波动极大。","普通人通过 ETF 参与，注意展期成本与跟踪误差。","商品配置宜小比例、短周期。"],sum:"商品是周期性工具，不是长期持有品。"},

{t:"REITs：当房东的另一种方式",lv:"中级",min:4,pts:["REITs 投资不动产并分红，流动性好于实物房产。","受利率影响明显，利率上行时估值承压。","适合追求稳定现金流、又不想管房子的人。"],sum:"收租不用修水管。"},

{t:"可转债：股债两面",lv:"中级",min:5,pts:["下有债底、上有股性，波动小于正股。","转股溢价率高时，性价比下降。","适合能看懂条款、愿意研究的人。"],sum:"先看溢价率，再谈收益。"},

{t:"杠杆：放大收益也放大错误",lv:"中级",min:5,pts:["融资融券、期货、杠杆 ETF 都会放大波动。","爆仓往往不是判断错，而是撑不到对的时候。","新手先不加杠杆，把仓位管理练熟再说。"],sum:"杠杆放大的是结果，不是能力。"},

{t:"仓位管理：比选股更重要",lv:"中级",min:5,pts:["单只标的不超过总仓位的 10-20%。","先定最大可承受亏损，再反推仓位。","分批建仓比一次性 All in 更容易执行。"],sum:"先算能亏多少，再决定买多少。"},

{t:"止损与止盈的规则化",lv:"中级",min:5,pts:["止损不是预测，而是控制单次错误的代价。","止盈可以用移动止盈或目标比例分批卖出。","规则要事先写下来，盘中不要临时改。"],sum:"规则写在盘前，执行在盘中。"},

{t:"交易成本与税",lv:"中级",min:4,pts:["佣金、印花税、过户费、申赎费都会磨损收益。","高频交易的成本常被低估。","长期持有 + 低换手，是省成本最有效的方式。"],sum:"少交易，就是省钱。"},

{t:"社保与公积金：别忽视的底盘",lv:"中级",min:5,pts:["社保包含养老、医疗、失业、工伤、生育，是基础保障。","公积金可用于买房、租房、大病，注意提取规则。","换工作时留意断缴影响（医保、购房资格）。"],sum:"社保是地基，商业保险是补充。"},

{t:"商业保险怎么配",lv:"中级",min:6,pts:["顺序：意外 → 医疗 → 重疾 → 寿险（有家庭责任时）。","保额优先于保障期限，先够用再谈终身。","保费控制在年收入 10% 以内比较合理。"],sum:"先保大风险，再谈小确幸。",q:{q:"家庭保障的第一顺位通常是？",o:["寿险","意外与医疗","年金"],a:1}},

{t:"重疾险与医疗险的区别",lv:"中级",min:5,pts:["医疗险报销治疗费用，实报实销。","重疾险一次性给付，可用于收入损失与康复支出。","两者互补，不能互相替代。"],sum:"一个报销，一个给付。"},

{t:"房贷：最大的负债怎么管",lv:"中级",min:5,pts:["月供不超过月收入 40%，留足应急金再上车。","利率类型（固定/浮动）决定你的利率风险。","提前还款要比较「省下的利息」与「失去的流动性」。"],sum:"房子是资产，房贷是杠杆。"},

{t:"提前还款划算吗",lv:"中级",min:4,pts:["比较房贷利率与你的理财收益率，谁高就优先谁。","等额本息前期利息多，提前还本省息更明显。","保留 6-12 个月应急金，别把钱全砸进房贷。"],sum:"算利率差，不算感觉。"},

{t:"信用卡的正确用法",lv:"中级",min:4,pts:["全额还款免息期是最大价值，分期与最低还款成本很高。","信用卡不是收入，是短期现金流工具。","别为了积分做不必要的消费。"],sum:"能做工具，别做习惯。"},

{t:"消费贷与网贷",lv:"中级",min:4,pts:["年化利率常被「日息」包装，实际成本可能很高。","优先偿还利率最高的负债。","以贷养贷是危险信号，尽快止损。"],sum:"利息高的债，先还它。"},

{t:"个人养老金账户",lv:"中级",min:4,pts:["每年有缴存上限，可享受税前扣除。","账户内投资通常有产品范围限制，长期锁定。","适合税率较高、有长期养老规划的人。"],sum:"省税 + 长期，才值得锁定。"},

{t:"个人资产负债表",lv:"高级",min:5,pts:["资产：现金、投资、房产、车辆；负债：房贷、消费贷、信用卡。","净资产 = 资产 - 负债，是你的真实家底。","每半年更新一次，趋势比绝对值重要。"],sum:"先算清净资产，才谈规划。"},

{t:"年度财务体检",lv:"高级",min:5,pts:["五项：结余率、应急金月数、负债率、保障缺口、投资组合偏离度。","每年固定一个月做，形成习惯。","发现问题只改一项，别一次全推倒。"],sum:"一年一检查，问题早发现。"},

{t:"写一份投资计划书",lv:"高级",min:5,pts:["写清目标、期限、可承受回撤、资产比例、买入与卖出规则。","落成文字，才不会被情绪改写。","每季度对照一次，偏离就调。"],sum:"计划写在纸上，纪律才有依据。"},

{t:"选基金的五步",lv:"高级",min:5,pts:["看策略是否清晰、费率是否低、规模是否适中、历史回撤是否可接受、经理是否稳定。","同策略优先选被动、低费。","别只看近一年收益。"],sum:"看策略与费率，不看短期排名。"},

{t:"读懂招募说明书",lv:"高级",min:5,pts:["重点看投资范围、费率结构、业绩基准、风险提示。","业绩基准能告诉你它到底想跑赢什么。","限购与赎回条款也要看。"],sum:"基准与费率，比宣传语重要。"},

{t:"组合回测能信几分",lv:"高级",min:5,pts:["回测容易过度拟合，尤其是参数挑得很细的策略。","看样本外表现与最大回撤，不只看年化收益。","回测是筛子，不是承诺。"],sum:"回测好看不等于未来好看。"},

{t:"投资记录与复盘",lv:"高级",min:4,pts:["记录买入理由、卖出理由、当时的情绪。","每月复盘一次，看决策质量而不是盈亏结果。","连续犯同一个错，就写成规则堵住它。"],sum:"复盘决策，不纠缠结果。"},

{t:"情绪管理：最大的敌人是自己",lv:"高级",min:5,pts:["制定规则在前，执行在后，减少临场决策。","大跌时先看计划，不看新闻。","把「不操作」也当成一种决策。"],sum:"管住手，比看懂市场更容易。"},

{t:"信息源怎么筛",lv:"高级",min:4,pts:["优先一手数据与规则文件，其次专业机构研究。","警惕标题党、荐股群、「内部消息」。","固定 3-5 个信息源，减少噪声。"],sum:"少看，但看对的。"},

{t:"宏观指标：CPI、PPI、PMI",lv:"高级",min:5,pts:["CPI 看居民物价，PPI 看工业出厂价，PMI 看景气扩张或收缩。","PMI 高于 50 通常表示扩张。","指标影响政策预期，进而影响利率与估值。"],sum:"三个指标，看政策方向。"},

{t:"利率环境怎么影响资产",lv:"高级",min:5,pts:["降息利好债券与成长股，升息反之。","利率是资产定价的分母，变化会放大估值波动。","判断利率方向比预测点位更实用。"],sum:"利率一动，全场重估。"},

{t:"行业轮动：别追热点",lv:"高级",min:4,pts:["轮动背后是景气与资金，普通投资者很难踩准。","用宽基 + 小比例行业配置，比全仓押注更稳。","热点往往在人尽皆知时结束。"],sum:"不追热点，配置宽基。"},

{t:"定投执行：怎么设规则",lv:"高级",min:5,pts:["固定日期、固定金额，工资到账次日自动扣款。","下跌时可小幅加码，但要设上限。","定投计划至少按年看，别按月评价。"],sum:"自动化执行，减少手动干预。"},

{t:"分红再投：复利加速器",lv:"高级",min:4,pts:["分红再投入能持续放大复利。","长期持有者优先选「红利再投资」设置。","频繁取现会打断复利链条。"],sum:"再投一次，就多一层复利。"},

{t:"卖出规则怎么写",lv:"高级",min:5,pts:["三类卖出：目标达成、逻辑破坏、更好的机会出现。","不要因为「涨太多」卖出，也不要因为「跌太多」割肉。","事先写下条件，触发才动手。"],sum:"卖出要有理由，不能只有情绪。"},

{t:"熊市怎么应对",lv:"高级",min:5,pts:["先确认应急金与保障到位，再谈抄底。","按计划分批定投，不预测底部。","熊市是积累筹码的阶段，不是证明自己的阶段。"],sum:"熊市攒筹码，牛市守纪律。"},

{t:"牛市纪律",lv:"高级",min:5,pts:["上涨时最容易加杠杆、加仓位、加预期。","按再平衡规则减仓，别被「这次不一样」说服。","记录每笔加仓的理由，事后回看。"],sum:"牛市亏钱的，多是忘了规则。"},

{t:"家庭财务沟通",lv:"高级",min:4,pts:["共同账户 + 各自账户，兼顾透明与自由。","大额支出提前约定阈值。","定期一起看账，比吵架有用。"],sum:"钱的事说在前面。"},

{t:"子女教育金规划",lv:"高级",min:4,pts:["先定时间与金额目标，再倒推每月投入。","长期目标适合权益类，短期目标用固收。","专款专用，别和教育金混在日常消费里。"],sum:"按时间倒推，专款专用。"},

{t:"退休要存多少",lv:"高级",min:5,pts:["估算退休后年支出，乘以 25（4% 法则）得到大致本金需求。","社保是底盘，个人账户与投资是补充。","越早开始，所需年储蓄越低。"],sum:"先算支出，再算本金。"},

{t:"保险理赔流程",lv:"高级",min:4,pts:["出险后及时报案，保留病历、发票、诊断证明。","看清免责条款与等待期。","拒赔可申诉，保留沟通记录。"],sum:"材料齐，理赔快。"},

{t:"常见投资骗局识别",lv:"高级",min:5,pts:["四个信号：保本高收益、拉人头返利、催促转账、无法说清盈利来源。","正规机构不会通过私人群收款。","遇到「内部消息」「稳赚」，先查资质。"],sum:"高收益 + 保本，必有一项是假的。"},
